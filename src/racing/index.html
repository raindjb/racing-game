<script>
// === audio.js — Racing Game ===
// Sound system using Web Audio API. All sounds procedurally generated (no external files).
// Exports: R.initAudio, R.playSound, R.updateAudio, R.stopAllSounds, R.setMasterVolume, R.toggleMute

// ---------------------------------------------------------------------------
// Internal module state (closure-scoped, not on R)
// ---------------------------------------------------------------------------

/** @type {AudioContext|null} */
let _ctx = null;

/** @type {GainNode|null} — master gain, connected to destination */
let _masterGain = null;

/** @type {boolean} */
let _muted = false;

/** @type {number} — saved volume level before muting, so toggleMute can restore */
let _preMuteVolume = 0.7;

/** @type {boolean} — true once initAudio succeeds; guards against operations on dead context */
let _initialized = false;

// ---- Oscillator pool (reuse for one-shot sounds) ----
/** @type {OscillatorNode[]} */
let _oscPool = [];
const _MAX_OSC_POOL = 16;       // pre-allocate this many oscillators

/** @type {GainNode[]} */
let _gainPool = [];
const _MAX_GAIN_POOL = 16;

// ---- Active continuous-sound references ----
/** @type {{ osc1: OscillatorNode, osc2: OscillatorNode, gain: GainNode, filter: BiquadFilterNode }|null} */
let _engineNodes = null;

/** @type {{ gain: GainNode, filter: BiquadFilterNode, noiseGen: (() => AudioBufferSourceNode)|null }|null} */
let _skidNodes = null;

/** @type {Set<AudioNode>} — all one-shot oscillators currently playing */
let _activeOneShots = new Set();

// ---- Reusable noise buffer (generated once, used for crash + skid) ----
/** @type {AudioBuffer|null} */
let _noiseBuffer = null;

// ---------------------------------------------------------------------------
// Internal helpers
// ---------------------------------------------------------------------------

/**
 * Safely retrieve a config value with a fallback default.
 * @param {string} key - Config key (e.g. 'VOLUME_MASTER')
 * @param {number} fallback
 * @returns {number}
 */
function _cfg(key, fallback) {
  return (R.CONFIG && typeof R.CONFIG[key] === 'number') ? R.CONFIG[key] : fallback;
}

/**
 * Ensure default config values exist on R.CONFIG.
 * Only sets values that are absent — never overwrites user config.
 */
function _ensureConfigDefaults() {
  if (!R.CONFIG) R.CONFIG = {};
  const defaults = {
    VOLUME_MASTER:   0.7,
    VOLUME_SFX:      0.6,
    VOLUME_ENGINE:   0.25,
    VOLUME_SKID:     0.35,
    ENGINE_FREQ_MIN: 80,
    ENGINE_FREQ_MAX: 400,
    ENGINE_DETUNE:   6,        // cents detune between two engine oscillators
    SKID_FREQ_MIN:   200,
    SKID_FREQ_MAX:   2000,
    COUNTDOWN_BEEP_FREQ: 440,
    COUNTDOWN_GO_FREQ:    880,
    COUNTDOWN_BEEP_DUR:   0.1,
    COUNTDOWN_GO_DUR:     0.3,
    COUNTDOWN_INTERVAL:   0.6,  // seconds between beeps
    MENU_SELECT_FREQ: 1000,
    MENU_SELECT_DUR:  0.03,
    CRASH_DURATION:   0.3,
    CRASH_CENTER_FREQ: 800,
    CRASH_BANDWIDTH:   600,
    FINISH_START_FREQ: 200,
    FINISH_END_FREQ:   800,
    FINISH_DURATION:   1.0,
    FINISH_DELAY_TIME: 0.15,
    FINISH_DELAY_FEEDBACK: 0.35
  };
  for (const [k, v] of Object.entries(defaults)) {
    if (R.CONFIG[k] === undefined) R.CONFIG[k] = v;
  }
}

/**
 * Create a stereo white-noise buffer (2 seconds, single-channel is fine — we use mono).
 * Generated once and cached in _noiseBuffer.
 * @returns {AudioBuffer|null}
 */
function _getNoiseBuffer() {
  if (_noiseBuffer) return _noiseBuffer;
  if (!_ctx) return null;
  try {
    const sampleRate = _ctx.sampleRate;
    const length = sampleRate * 2; // 2 seconds of noise
    const buffer = _ctx.createBuffer(1, length, sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < length; i++) {
      data[i] = Math.random() * 2 - 1;
    }
    _noiseBuffer = buffer;
    return buffer;
  } catch (e) {
    return null;
  }
}

/**
 * Acquire an oscillator from the pool or create a new one.
 * Returns null if AudioContext is unavailable.
 * @returns {OscillatorNode|null}
 */
function _acquireOsc() {
  if (!_ctx) return null;
  if (_oscPool.length > 0) return _oscPool.pop();
  try { return _ctx.createOscillator(); } catch (e) { return null; }
}

/**
 * Acquire a gain node from the pool or create new.
 * @returns {GainNode|null}
 */
function _acquireGain() {
  if (!_ctx) return null;
  if (_gainPool.length > 0) return _gainPool.pop();
  try { return _ctx.createGain(); } catch (e) { return null; }
}

/**
 * Return an oscillator to the pool for reuse.
 * @param {OscillatorNode} osc
 */
function _releaseOsc(osc) {
  if (!osc) return;
  try { osc.disconnect(); } catch (e) { /* already disconnected */ }
  _activeOneShots.delete(osc);
  if (_oscPool.length < _MAX_OSC_POOL) _oscPool.push(osc);
}

/**
 * Return a gain node to the pool.
 * @param {GainNode} gain
 */
function _releaseGain(gain) {
  if (!gain) return;
  try { gain.disconnect(); } catch (e) { /* ignore */ }
  if (_gainPool.length < _MAX_GAIN_POOL) _gainPool.push(gain);
}

/**
 * Schedule a gain ramp to 0 and auto-cleanup after `duration` seconds.
 * @param {GainNode} gain
 * @param {number} startValue
 * @param {number} duration - seconds from now until silent
 * @param {OscillatorNode} [osc] - if provided, stop + release after fade
 * @param {AudioBufferSourceNode} [src] - if provided, stop + disconnect after fade
 */
function _scheduleFadeOut(gain, startValue, duration, osc, src) {
  if (!gain || !_ctx) return;
  const now = _ctx.currentTime;
  try {
    gain.gain.setValueAtTime(startValue, now);
    gain.gain.linearRampToValueAtTime(0, now + duration + 0.01);
  } catch (e) { /* ignore */ }

  const cleanupTime = now + duration + 0.05;
  if (osc) {
    try { osc.stop(cleanupTime); } catch (e) { /* already stopped */ }
    setTimeout(() => _releaseOsc(osc), (cleanupTime - _ctx.currentTime) * 1000 + 100);
  }
  if (src) {
    try { src.stop(cleanupTime); } catch (e) { /* already stopped */ }
    setTimeout(() => { try { src.disconnect(); } catch (e) { /* ignore */ } }, (cleanupTime - _ctx.currentTime) * 1000 + 100);
  }
}

/**
 * Small helper: schedule a precise beep.
 * @param {number} freq - Hz
 * @param {number} startTime - AudioContext time
 * @param {number} duration - seconds
 * @param {number} volume - gain 0-1
 */
function _scheduleBeep(freq, startTime, duration, volume) {
  if (!_ctx || !_masterGain) return;
  const osc = _acquireOsc();
  const g = _acquireGain();
  if (!osc || !g) return;

  try {
    osc.type = 'square';
    osc.frequency.setValueAtTime(freq, startTime);
  } catch (e) { _releaseOsc(osc); _releaseGain(g); return; }

  try { g.gain.setValueAtTime(0, startTime); } catch (e) { /* ignore */ }
  try { g.gain.linearRampToValueAtTime(volume, startTime + 0.005); } catch (e) { /* ignore */ }
  try { g.gain.setValueAtTime(volume, startTime + duration * 0.7); } catch (e) { /* ignore */ }
  try { g.gain.linearRampToValueAtTime(0, startTime + duration + 0.01); } catch (e) { /* ignore */ }

  try { osc.connect(g); } catch (e) { _releaseOsc(osc); _releaseGain(g); return; }
  try { g.connect(_masterGain); } catch (e) { _releaseOsc(osc); _releaseGain(g); return; }

  _activeOneShots.add(osc);
  try { osc.start(startTime); } catch (e) { /* ignore */ }
  try { osc.stop(startTime + duration + 0.02); } catch (e) { /* ignore */ }

  // Cleanup after the note ends
  const cleanupDelay = (duration + 0.1) * 1000;
  setTimeout(() => {
    _releaseOsc(osc);
    _releaseGain(g);
  }, cleanupDelay);
}

// ===================================================================
// PUBLIC API — attached to window.R
// ===================================================================

/**
 * Initialize the audio system. Must be called once, typically after a user
 * gesture (click / tap / keypress) so the browser allows AudioContext creation.
 *
 * On failure (e.g. browser blocks autoplay), all R.playSound calls become
 * no-ops and the game continues silently.
 */
R.initAudio = function () {
  if (_initialized) return;

  _ensureConfigDefaults();

  try {
    // Some browsers use webkitAudioContext
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (!AudioCtx) {
      console.warn('[audio] Web Audio API not available in this browser.');
      return;
    }
    _ctx = new AudioCtx();
  } catch (e) {
    console.warn('[audio] Failed to create AudioContext:', e.message);
    _ctx = null;
    return;
  }

  try {
    _masterGain = _ctx.createGain();
    _masterGain.gain.value = _cfg('VOLUME_MASTER', 0.7);
    _masterGain.connect(_ctx.destination);
  } catch (e) {
    console.warn('[audio] Failed to create master gain:', e.message);
    _ctx = null;
    _masterGain = null;
    return;
  }

  // Pre-fill oscillator and gain pools
  for (let i = 0; i < _MAX_OSC_POOL; i++) {
    try {
      const osc = _ctx.createOscillator();
      _oscPool.push(osc);
    } catch (e) { break; }
  }
  for (let i = 0; i < _MAX_GAIN_POOL; i++) {
    try {
      const g = _ctx.createGain();
      _gainPool.push(g);
    } catch (e) { break; }
  }

  // Generate the noise buffer eagerly
  _getNoiseBuffer();

  _initialized = true;
  console.log('[audio] Audio system initialized. Sample rate:', _ctx.sampleRate, 'Hz');
};

/**
 * Play a procedural sound effect.
 *
 * @param {string} type - One of: 'engine', 'crash', 'skid', 'countdown', 'go',
 *   'finish', 'menu_select'
 * @param {Object} [params={}] - Type-specific parameters:
 *   - crash: { intensity: 0..1 }
 *   - engine: { speed: number, maxSpeed: number }
 */
R.playSound = function (type, params) {
  if (!_initialized || !_ctx || !_masterGain) return;
  if (_muted) return; // Respect mute state

  params = params || {};

  switch (type) {

    // ------------------------------------------------------------------
    // ENGINE — continuous rumble, started once and updated per frame
    // ------------------------------------------------------------------
    case 'engine':
      {
        if (_engineNodes) return; // Already running
        const vol = _cfg('VOLUME_ENGINE', 0.25);

        // Low-pass filter for muffled engine character
        let filter;
        try { filter = _ctx.createBiquadFilter(); } catch (e) { return; }
        filter.type = 'lowpass';
        filter.frequency.value = 300;
        filter.Q.value = 1;

        // Two detuned oscillators for richness
        const osc1 = _acquireOsc();
        const osc2 = _acquireOsc();
        const gain = _acquireGain();
        if (!osc1 || !osc2 || !gain) {
          _releaseOsc(osc1); _releaseOsc(osc2); _releaseGain(gain);
          return;
        }

        const detuneCents = _cfg('ENGINE_DETUNE', 6);
        const freqMin = _cfg('ENGINE_FREQ_MIN', 80);

        try {
          osc1.type = 'sawtooth';
          osc2.type = 'sawtooth';
          osc1.frequency.value = freqMin;
          osc2.frequency.value = freqMin;
          osc1.detune.value = -detuneCents;
          osc2.detune.value = detuneCents;

          gain.gain.value = 0; // Start silent, fade in

          osc1.connect(gain);
          osc2.connect(gain);
          gain.connect(filter);
          filter.connect(_masterGain);

          osc1.start();
          osc2.start();
        } catch (e) {
          _releaseOsc(osc1); _releaseOsc(osc2); _releaseGain(gain);
          return;
        }

        // Fade engine in over 0.3s to avoid pop
        try {
          const now = _ctx.currentTime;
          gain.gain.linearRampToValueAtTime(vol, now + 0.3);
        } catch (e) { /* ignore */ }

        _engineNodes = { osc1, osc2, gain, filter };
      }
      break;

    // ------------------------------------------------------------------
    // CRASH — short noise burst
    // ------------------------------------------------------------------
    case 'crash':
      {
        const intensity = Math.max(0, Math.min(1, params.intensity || 0.5));
        const vol = _cfg('VOLUME_SFX', 0.6) * (0.4 + intensity * 0.6);
        const duration = _cfg('CRASH_DURATION', 0.3);

        const noiseBuf = _getNoiseBuffer();
        if (!noiseBuf) return;

        let src, bandpass, gain;
        try {
          src = _ctx.createBufferSource();
          bandpass = _ctx.createBiquadFilter();
          gain = _acquireGain();
          if (!gain) { src = null; throw new Error('no gain'); }
        } catch (e) { return; }

        src.buffer = noiseBuf;
        src.loop = false;

        bandpass.type = 'bandpass';
        bandpass.frequency.value = _cfg('CRASH_CENTER_FREQ', 800);
        bandpass.Q.value = bandpass.frequency.value / _cfg('CRASH_BANDWIDTH', 600);

        try {
          src.connect(bandpass);
          bandpass.connect(gain);
          gain.connect(_masterGain);
        } catch (e) {
          try { src.disconnect(); } catch (ex) { /* ignore */ }
          _releaseGain(gain);
          return;
        }

        _scheduleFadeOut(gain, vol, duration, null, src);
        try { src.start(); } catch (e) { /* ignore */ }

        // Auto-cleanup
        setTimeout(() => {
          try { bandpass.disconnect(); } catch (e) { /* ignore */ }
          _releaseGain(gain);
        }, (duration + 0.2) * 1000);
      }
      break;

    // ------------------------------------------------------------------
    // SKID — continuous noise, started when drifting
    // ------------------------------------------------------------------
    case 'skid':
      {
        if (_skidNodes) return; // Already skidding
        const vol = _cfg('VOLUME_SKID', 0.35);

        const noiseBuf = _getNoiseBuffer();
        if (!noiseBuf) return;

        let src, filter, gain;
        try {
          src = _ctx.createBufferSource();
          filter = _ctx.createBiquadFilter();
          gain = _acquireGain();
          if (!gain) { src = null; throw new Error('no gain'); }
        } catch (e) { return; }

        src.buffer = noiseBuf;
        src.loop = true;

        filter.type = 'bandpass';
        filter.frequency.value = _cfg('SKID_FREQ_MIN', 200);
        filter.Q.value = 1.5;

        try {
          gain.gain.value = 0;
          src.connect(filter);
          filter.connect(gain);
          gain.connect(_masterGain);
        } catch (e) {
          try { src.disconnect(); } catch (ex) { /* ignore */ }
          _releaseGain(gain);
          return;
        }

        // Fade in
        try {
          const now = _ctx.currentTime;
          gain.gain.linearRampToValueAtTime(vol, now + 0.15);
        } catch (e) { /* ignore */ }

        try { src.start(); } catch (e) { /* ignore */ }

        _skidNodes = { gain, filter, noiseGen: null }; // noiseGen unused but kept for shape
      }
      break;

    // ------------------------------------------------------------------
    // COUNTDOWN — three low beeps then one high "GO!" beep
    // ------------------------------------------------------------------
    case 'countdown':
      {
        const beepFreq = _cfg('COUNTDOWN_BEEP_FREQ', 440);
        const goFreq = _cfg('COUNTDOWN_GO_FREQ', 880);
        const beepDur = _cfg('COUNTDOWN_BEEP_DUR', 0.1);
        const interval = _cfg('COUNTDOWN_INTERVAL', 0.6);
        const sfxVol = _cfg('VOLUME_SFX', 0.6);
        const now = _ctx.currentTime;

        // 3… 2… 1…
        for (let i = 0; i < 3; i++) {
          _scheduleBeep(beepFreq, now + i * interval, beepDur, sfxVol);
        }
        // GO! — also handled separately via 'go' sound, but include here for completeness
        // (The 'go' sound type below handles the higher-pitched final beep.)
      }
      break;

    // ------------------------------------------------------------------
    // GO — the higher-pitched final countdown beep
    // ------------------------------------------------------------------
    case 'go':
      {
        const goFreq = _cfg('COUNTDOWN_GO_FREQ', 880);
        const goDur = _cfg('COUNTDOWN_GO_DUR', 0.3);
        const sfxVol = _cfg('VOLUME_SFX', 0.6);
        const now = _ctx.currentTime;
        _scheduleBeep(goFreq, now, goDur, sfxVol * 1.1);
      }
      break;

    // ------------------------------------------------------------------
    // FINISH — ascending sweep with delay (reverb-like)
    // ------------------------------------------------------------------
    case 'finish':
      {
        const startFreq = _cfg('FINISH_START_FREQ', 200);
        const endFreq = _cfg('FINISH_END_FREQ', 800);
        const duration = _cfg('FINISH_DURATION', 1.0);
        const delayTime = _cfg('FINISH_DELAY_TIME', 0.15);
        const delayFeedback = _cfg('FINISH_DELAY_FEEDBACK', 0.35);
        const sfxVol = _cfg('VOLUME_SFX', 0.6);

        const osc = _acquireOsc();
        const gain = _acquireGain();
        const delay = _ctx.createDelay(2.0);
        const feedbackGain = _acquireGain();
        const dryGain = _acquireGain();
        if (!osc || !gain || !delay || !feedbackGain || !dryGain) {
          _releaseOsc(osc); _releaseGain(gain); _releaseGain(feedbackGain); _releaseGain(dryGain);
          return;
        }

        try {
          // Delay setup with feedback
          delay.delayTime.value = delayTime;
          feedbackGain.gain.value = delayFeedback;

          // Dry/wet mix: dry at full vol, wet (delayed) at ~60%
          dryGain.gain.value = 1.0;
          const wetGain = _acquireGain();
          if (wetGain) { try { wetGain.gain.value = 0.6; } catch (e) { /* ignore */ } }

          osc.type = 'sine';
          const now = _ctx.currentTime;
          osc.frequency.setValueAtTime(startFreq, now);
          osc.frequency.linearRampToValueAtTime(endFreq, now + duration);

          gain.gain.setValueAtTime(0, now);
          gain.gain.linearRampToValueAtTime(sfxVol, now + 0.05);
          gain.gain.setValueAtTime(sfxVol, now + duration * 0.6);
          gain.gain.linearRampToValueAtTime(0, now + duration + 0.05);

          // Routing: osc → gain → dryGain → masterGain
          //                   → delay → feedbackGain → delay (feedback)
          //                   → delay → wetGain → masterGain
          osc.connect(gain);

          // Dry path
          gain.connect(dryGain);
          dryGain.connect(_masterGain);

          // Delay path
          gain.connect(delay);
          delay.connect(feedbackGain);
          feedbackGain.connect(delay); // feedback loop
          if (wetGain) {
            delay.connect(wetGain);
            wetGain.connect(_masterGain);
          }

          _activeOneShots.add(osc);
          osc.start(now);
          osc.stop(now + duration + 0.1);
        } catch (e) {
          _releaseOsc(osc); _releaseGain(gain); _releaseGain(feedbackGain); _releaseGain(dryGain);
          return;
        }

        // Cleanup after sound finishes + reverb tail
        const cleanupMs = (duration + delayTime * 4 + 0.5) * 1000;
        setTimeout(() => {
          _releaseOsc(osc);
          _releaseGain(gain);
          _releaseGain(feedbackGain);
          _releaseGain(dryGain);
          try { delay.disconnect(); } catch (e) { /* ignore */ }
        }, cleanupMs);
      }
      break;

    // ------------------------------------------------------------------
    // MENU_SELECT — short click
    // ------------------------------------------------------------------
    case 'menu_select':
      {
        const freq = _cfg('MENU_SELECT_FREQ', 1000);
        const dur = _cfg('MENU_SELECT_DUR', 0.03);
        const sfxVol = _cfg('VOLUME_SFX', 0.6);
        const now = _ctx.currentTime;

        const osc = _acquireOsc();
        const gain = _acquireGain();
        if (!osc || !gain) { _releaseOsc(osc); _releaseGain(gain); return; }

        try {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, now);
          gain.gain.setValueAtTime(0, now);
          gain.gain.linearRampToValueAtTime(sfxVol * 0.5, now + 0.002);
          gain.gain.linearRampToValueAtTime(0, now + dur);

          osc.connect(gain);
          gain.connect(_masterGain);

          _activeOneShots.add(osc);
          osc.start(now);
          osc.stop(now + dur + 0.01);
        } catch (e) {
          /* cleanup handled below */
        }

        setTimeout(() => {
          _releaseOsc(osc);
          _releaseGain(gain);
        }, (dur + 0.1) * 1000);
      }
      break;

    default:
      // Unknown sound type — silently ignored
      break;
  }
};

// ===================================================================
// CONTINUOUS SOUND UPDATE — called every frame by the game loop
// ===================================================================

/**
 * Update continuous sounds (engine pitch, skid filter). Called each frame with
 * the delta time in seconds. Reads current car state from R.playerCar (or the
 * first car in R.cars if that convention is used).
 *
 * @param {number} dt - Delta time in seconds
 */
R.updateAudio = function (dt) {
  if (!_initialized || !_ctx || !_masterGain) return;
  if (_muted && _engineNodes) {
    // Keep engine silent while muted but don't tear it down
    return;
  }

  const now = _ctx.currentTime;

  // ---- Engine sound update ----
  if (_engineNodes) {
    const en = _engineNodes;
    const car = (R.playerCar) || (R.cars && R.cars[0]) || null;

    let speed = 0;
    let maxSpeed = 300; // fallback
    if (car && typeof car.speed === 'number') {
      speed = Math.abs(car.speed);
      maxSpeed = (typeof car.maxSpeed === 'number' && car.maxSpeed > 0) ? car.maxSpeed : 300;
    }

    // Clamp speed ratio
    const ratio = Math.max(0, Math.min(1, speed / maxSpeed));
    const freqMin = _cfg('ENGINE_FREQ_MIN', 80);
    const freqMax = _cfg('ENGINE_FREQ_MAX', 400);
    const targetFreq = freqMin + ratio * (freqMax - freqMin);

    // Smooth frequency transition to avoid pops (exponential smoothing)
    try {
      // Ramp over a short window rather than instantaneous set
      en.osc1.frequency.linearRampToValueAtTime(targetFreq, now + 0.05);
      en.osc2.frequency.linearRampToValueAtTime(targetFreq, now + 0.05);

      // Adjust filter cutoff: higher speed = more open filter
      const filterFreq = 150 + ratio * 350;
      en.filter.frequency.linearRampToValueAtTime(filterFreq, now + 0.05);
    } catch (e) { /* ignore — oscillators may have been stopped */ }
  }

  // ---- Skid sound update ----
  if (_skidNodes) {
    const sk = _skidNodes;
    const car = (R.playerCar) || (R.cars && R.cars[0]) || null;

    let driftMag = 0;
    if (car && typeof car.driftFactor === 'number') {
      driftMag = Math.abs(car.driftFactor);
    }

    // If drift is negligible, stop skid sound
    if (driftMag < 0.05) {
      // Fade out and tear down
      try {
        sk.gain.gain.linearRampToValueAtTime(0, now + 0.1);
      } catch (e) { /* ignore */ }
      setTimeout(() => {
        if (_skidNodes === sk) {
          _stopSkidInternal();
        }
      }, 150);
      _skidNodes = null;
      return;
    }

    // Sweep bandpass filter based on drift magnitude
    const skidFreqMin = _cfg('SKID_FREQ_MIN', 200);
    const skidFreqMax = _cfg('SKID_FREQ_MAX', 2000);
    const targetFilterFreq = skidFreqMin + driftMag * (skidFreqMax - skidFreqMin);
    const targetVol = _cfg('VOLUME_SKID', 0.35) * (0.3 + driftMag * 0.7);

    try {
      sk.filter.frequency.linearRampToValueAtTime(targetFilterFreq, now + 0.05);
      sk.gain.gain.linearRampToValueAtTime(targetVol, now + 0.05);
    } catch (e) { /* ignore */ }
  }
};

// ===================================================================
// SOUND LIFECYCLE
// ===================================================================

/**
 * Internal: tear down the engine sound nodes.
 */
function _stopEngineInternal() {
  if (!_engineNodes) return;
  const en = _engineNodes;
  try {
    const now = _ctx ? _ctx.currentTime : 0;
    if (en.gain && now > 0) {
      en.gain.gain.linearRampToValueAtTime(0, now + 0.05);
    }
  } catch (e) { /* ignore */ }

  // Schedule actual disconnect after the ramp
  setTimeout(() => {
    try { en.osc1.stop(); } catch (e) { /* ignore */ }
    try { en.osc2.stop(); } catch (e) { /* ignore */ }
    _releaseOsc(en.osc1);
    _releaseOsc(en.osc2);
    _releaseGain(en.gain);
    try { en.filter.disconnect(); } catch (e) { /* ignore */ }
  }, 100);

  _engineNodes = null;
}

/**
 * Internal: tear down the skid sound nodes.
 */
function _stopSkidInternal() {
  if (!_skidNodes) return;
  const sk = _skidNodes;
  try { sk.gain.gain.value = 0; } catch (e) { /* ignore */ }
  setTimeout(() => {
    _releaseGain(sk.gain);
    try { sk.filter.disconnect(); } catch (e) { /* ignore */ }
  }, 100);
  _skidNodes = null;
}

/**
 * Stop all active continuous and one-shot sounds immediately.
 * Called when leaving a race or resetting state.
 */
R.stopAllSounds = function () {
  if (!_initialized || !_ctx) return;

  // Tear down engine
  _stopEngineInternal();

  // Tear down skid
  _stopSkidInternal();

  // Stop all active one-shot oscillators
  const now = _ctx.currentTime;
  for (const osc of _activeOneShots) {
    try {
      // Quick fade to avoid click
      osc.stop(now + 0.01);
    } catch (e) { /* already stopped */ }
    try { osc.disconnect(); } catch (e) { /* ignore */ }
  }
  _activeOneShots.clear();
};

// ===================================================================
// VOLUME CONTROL
// ===================================================================

/**
 * Set the master volume level.
 * @param {number} v - Volume 0..1 (clamped internally)
 */
R.setMasterVolume = function (v) {
  const clamped = Math.max(0, Math.min(1, v));
  if (_masterGain) {
    try {
      const now = _ctx ? _ctx.currentTime : 0;
      _masterGain.gain.linearRampToValueAtTime(clamped, now + 0.02);
    } catch (e) {
      try { _masterGain.gain.value = clamped; } catch (e2) { /* ignore */ }
    }
  }
  // Sync config
  if (R.CONFIG) R.CONFIG.VOLUME_MASTER = clamped;
  if (!_muted) _preMuteVolume = clamped;
};

/**
 * Toggle mute on/off. Restores previous volume when unmuting.
 */
R.toggleMute = function () {
  _muted = !_muted;

  if (_muted) {
    // Save current volume, then set gain to 0
    if (_masterGain) {
      try {
        _preMuteVolume = _masterGain.gain.value;
        _masterGain.gain.value = 0;
      } catch (e) { /* ignore */ }
    }
  } else {
    // Restore
    if (_masterGain) {
      try {
        _masterGain.gain.linearRampToValueAtTime(_preMuteVolume, (_ctx ? _ctx.currentTime : 0) + 0.02);
      } catch (e) {
        try { _masterGain.gain.value = _preMuteVolume; } catch (e2) { /* ignore */ }
      }
    }
  }
};

// ===================================================================
// LIFECYCLE — resume AudioContext after browser suspension
// ===================================================================

/**
 * Resume the AudioContext if it was suspended (e.g. browser autoplay policy).
 * Should be called on the first user gesture (click/touch/keypress).
 * Safe to call multiple times.
 */
R.resumeAudio = function () {
  if (_ctx && _ctx.state === 'suspended') {
    _ctx.resume().catch(function (e) {
      console.warn('[audio] Failed to resume AudioContext:', e.message);
    });
  }
};

// ===================================================================
// EXPORTED: R.initAudio, R.playSound, R.updateAudio, R.stopAllSounds,
//           R.setMasterVolume, R.toggleMute, R.resumeAudio
// ===================================================================

</script>

<script>
// === scenery.js — Racing Game ===
// Track-side scenery generation and rendering.
// Buildings, trees, billboards, barriers, grandstands, and crowds.

// ---------------------------------------------------------------------------
// Scenery configuration — extend R.CONFIG
// ---------------------------------------------------------------------------
R.CONFIG = R.CONFIG || {};
R.CONFIG.SCENERY_OBJECTS = R.CONFIG.SCENERY_OBJECTS || 600;
R.CONFIG.SCENERY_CULL_DISTANCE = R.CONFIG.SCENERY_CULL_DISTANCE || 1200;
R.CONFIG.SCENERY_CULL_MARGIN = R.CONFIG.SCENERY_CULL_MARGIN || 200;
R.CONFIG.SCENERY_SEGMENT_STEP = R.CONFIG.SCENERY_SEGMENT_STEP || 5;
R.CONFIG.SCENERY_TRACK_EDGE_OFFSET_MIN = R.CONFIG.SCENERY_TRACK_EDGE_OFFSET_MIN || 30;
R.CONFIG.SCENERY_TRACK_EDGE_OFFSET_MAX = R.CONFIG.SCENERY_TRACK_EDGE_OFFSET_MAX || 220;
R.CONFIG.SCENERY_BUILDING_CLUSTER_RANGE = R.CONFIG.SCENERY_BUILDING_CLUSTER_RANGE || 30;
R.CONFIG.SCENERY_GRANDSTAND_SEGMENT_INDEX = R.CONFIG.SCENERY_GRANDSTAND_SEGMENT_INDEX || 0;

// ---------------------------------------------------------------------------
// Scenery object pool
// ---------------------------------------------------------------------------
R.sceneryObjects = [];

// ---------------------------------------------------------------------------
// Internal constants (not tunable via CONFIG — visual constants)
// ---------------------------------------------------------------------------

const SCENERY_TYPES = ['building', 'tree', 'billboard', 'barrier', 'grandstand'];
// Weighted distribution: buildings (25%), trees (40%), billboards (15%), barriers (15%), grandstands (5%)
const SCENERY_WEIGHTS = [25, 40, 15, 15, 5];

const TREE_GREENS = ['#2d5a1e', '#3b7a2d', '#4a8c3f', '#1e4d2b', '#5a7d3a', '#2e6b20'];
const BUILDING_COLORS = ['#c4c4c4', '#d4c8b8', '#b8b4a8', '#ccc0b0', '#beb8a8', '#d0d0d0',
                         '#c8bca8', '#b0b0c0', '#c0b8b0', '#d8d0c0'];
const ROOF_COLORS = ['#8b4513', '#a0522d', '#6b3410', '#7b3f20', '#8b3a3a', '#696969',
                     '#4a4a4a', '#555555'];
const BILLBOARD_COLORS = ['#ff4444', '#4488ff', '#ffaa00', '#44cc44', '#ff44ff',
                           '#ffdd00', '#00cccc', '#ff6688'];
const SKIN_TONES = ['#f5c6a0', '#e8b88a', '#d4a574', '#c68642', '#f0d5b0', '#e0ac69'];
const SHIRT_COLORS = ['#e03030', '#3030e0', '#30a030', '#e0a030', '#30a0a0', '#8030a0',
                       '#e06060', '#d0d0d0', '#202020', '#f0a030'];

// ---------------------------------------------------------------------------
// Helpers
// ---------------------------------------------------------------------------

/**
 * Weighted random selection from SCENERY_TYPES using SCENERY_WEIGHTS.
 * @returns {string} scenery type key
 */
function weightedRandomType() {
  let total = 0;
  for (let i = 0; i < SCENERY_WEIGHTS.length; i++) {
    total += SCENERY_WEIGHTS[i];
  }
  let roll = Math.random() * total;
  for (let i = 0; i < SCENERY_WEIGHTS.length; i++) {
    roll -= SCENERY_WEIGHTS[i];
    if (roll <= 0) {
      return SCENERY_TYPES[i];
    }
  }
  return 'tree';
}

/**
 * Random int in [min, max].
 */
function randInt(min, max) {
  return Math.floor(Math.random() * (max - min + 1)) + min;
}

/**
 * Random float in [min, max].
 */
function randFloat(min, max) {
  return Math.random() * (max - min) + min;
}

/**
 * Pick a random element from an array.
 */
function randPick(arr) {
  return arr[Math.floor(Math.random() * arr.length)];
}

/**
 * Linear interpolation.
 */
function lerp(a, b, t) {
  return a + (b - a) * t;
}

/**
 * Clamp a value.
 */
function clamp(val, lo, hi) {
  return val < lo ? lo : val > hi ? hi : val;
}

/**
 * Compute screen-space depth from world position relative to camera.
 * Positive z means farther away (on screen, y goes down; worldZ tilts toward horizon).
 */
function computeScreenDepth(worldX, worldY, worldZ, camX, camY) {
  // Approximate: distance from camera position (ignoring z for simplicity)
  var dx = worldX - camX;
  var dy = worldY - camY;
  var dist = Math.sqrt(dx * dx + dy * dy);
  return dist + worldZ * 0.5; // z pushes into depth
}

// ---------------------------------------------------------------------------
// R.initScenery — populate R.sceneryObjects along the track
// ---------------------------------------------------------------------------
R.initScenery = function () {
  R.sceneryObjects = [];
  if (!R.track || !R.track.segments) return;
  var segments = R.track.segments;
  if (!segments || segments.length === 0) return;

  var step = R.CONFIG.SCENERY_SEGMENT_STEP;
  var totalSegments = segments.length;
  var startFinishSeg = R.CONFIG.SCENERY_GRANDSTAND_SEGMENT_INDEX;

  // Pre-compute per-segment direction vectors for perpendicular offsets
  var dirs = [];
  for (var i = 0; i < totalSegments; i++) {
    var prev = segments[(i - 1 + totalSegments) % totalSegments];
    var curr = segments[i];
    var dx = curr.worldX - prev.worldX;
    var dy = curr.worldY - prev.worldY;
    var len = Math.sqrt(dx * dx + dy * dy);
    if (len < 1) {
      // degenerate — reuse previous dir
      dirs.push(dirs.length > 0 ? dirs[dirs.length - 1] : { dx: 1, dy: 0, len: 1 });
    } else {
      dirs.push({ dx: dx / len, dy: dy / len, len: len });
    }
  }

  // Place grandstand near start/finish line, off to the right
  var startSeg = segments[startFinishSeg];
  var startDir = dirs[startFinishSeg];
  var perpX = -startDir.dy; // right perpendicular
  var perpY = startDir.dx;
  R.sceneryObjects.push({
    worldX: startSeg.worldX + perpX * 150,
    worldY: startSeg.worldY + perpY * 150,
    worldZ: startSeg.worldZ,
    type: 'grandstand',
    width: 300,
    height: 120,
    color: randPick(BUILDING_COLORS),
    variant: 1
  });

  // Generate scenery along every Nth segment
  var buildingClusterSegments = [];
  for (var s = 0; s < totalSegments; s += step) {
    var seg = segments[s];
    var dir = dirs[s];
    var perpRightX = -dir.dy;
    var perpRightY = dir.dx;

    // Determine if this segment is near start/finish (for building clustering)
    var distFromHome = Math.min(
      Math.abs(s - startFinishSeg),
      totalSegments - Math.abs(s - startFinishSeg)
    );

    // Choose type — rural vs urban bias
    var rawType = weightedRandomType();
    if (rawType === 'building') {
      if (distFromHome > R.CONFIG.SCENERY_BUILDING_CLUSTER_RANGE) {
        // Far from start/finish — convert some buildings to trees
        if (Math.random() < 0.7) rawType = 'tree';
      }
    }
    if (rawType === 'tree') {
      if (distFromHome <= R.CONFIG.SCENERY_BUILDING_CLUSTER_RANGE && Math.random() < 0.3) {
        rawType = 'building'; // some trees become buildings near start/finish
      }
    }

    // Only one grandstand (placed above)
    if (rawType === 'grandstand') {
      rawType = 'building';
    }

    // Choose side: left or right (biased toward outside of curves)
    var side = Math.random() < 0.5 ? 1 : -1;
    if (seg.curvature !== undefined && seg.curvature !== 0) {
      // Bias toward outside of curve
      side = seg.curvature > 0 ? 1 : -1;
      if (Math.random() < 0.3) side = -side; // 30% chance of inner placement
    }

    var offsetDist = randFloat(
      R.CONFIG.SCENERY_TRACK_EDGE_OFFSET_MIN,
      R.CONFIG.SCENERY_TRACK_EDGE_OFFSET_MAX
    ) + seg.width * 0.5;

    var obj = {
      worldX: seg.worldX + perpRightX * offsetDist * side,
      worldY: seg.worldY + perpRightY * offsetDist * side,
      worldZ: seg.worldZ || 0,
      type: rawType,
      width: 0,
      height: 0,
      color: '',
      variant: 0,
      rotation: 0
    };

    // Tune dimensions and color by type
    switch (rawType) {
      case 'building':
        obj.width = randInt(30, 90);
        obj.height = randInt(40, 160);
        obj.color = randPick(BUILDING_COLORS);
        obj.variant = randInt(0, 3); // 0=flat roof, 1=peaked, 2=wide, 3=tall+narrow
        buildingClusterSegments.push(s);
        break;

      case 'tree':
        obj.width = randInt(18, 40);
        obj.height = randInt(30, 70);
        obj.color = randPick(TREE_GREENS);
        obj.variant = randInt(0, 2); // 0=round, 1=pine, 2=double-canopy
        obj.rotation = randFloat(-0.3, 0.3); // slight random lean
        break;

      case 'billboard':
        obj.width = randInt(40, 70);
        obj.height = randInt(50, 90);
        obj.color = randPick(BILLBOARD_COLORS);
        obj.variant = randInt(0, 1); // 0=single pole, 1=double pole
        break;

      case 'barrier':
        obj.width = randInt(15, 30);
        obj.height = randInt(8, 16);
        obj.color = '#cc0000'; // red base, white stripes added in render
        obj.variant = 0;
        // Place barriers closer to track edge
        obj.worldX = seg.worldX + perpRightX * (seg.width * 0.5 + randInt(5, 15)) * side;
        obj.worldY = seg.worldY + perpRightY * (seg.width * 0.5 + randInt(5, 15)) * side;
        break;

      default:
        break;
    }

    R.sceneryObjects.push(obj);
  }

  // Depth-sort by worldZ + distance from origin (approximate back-to-front for rendering)
  // We'll sort per-frame in render for accurate camera-relative depth.
};

// ---------------------------------------------------------------------------
// R.renderScenery — render visible scenery objects
// ---------------------------------------------------------------------------
R.renderScenery = function () {
  var ctx = R.ctx;
  var cam = R.camera;
  var cullDist = R.CONFIG.SCENERY_CULL_DISTANCE;
  var margin = R.CONFIG.SCENERY_CULL_MARGIN;
  var objects = R.sceneryObjects;
  var n = objects.length;
  if (n === 0) return;

  var camX = cam.x;
  var camY = cam.y;

  // First pass: compute screen positions and depth, collect visible objects
  var visible = [];
  for (var i = 0; i < n; i++) {
    var obj = objects[i];
    var screen = R.worldToScreen
      ? R.worldToScreen(obj.worldX, obj.worldY, obj.worldZ)
      : defaultWorldToScreen(obj.worldX, obj.worldY, obj.worldZ, camX, camY, cam.zoom);

    if (!screen || !screen.visible) continue;

    // Cull by screen-space bounding box with margin
    var hw = obj.width * screen.scale * 0.5;
    var hh = obj.height * screen.scale * 0.5;
    if (screen.x + hw < -margin || screen.x - hw > R.canvas.width + margin ||
        screen.y + hh < -margin || screen.y - hh > R.canvas.height + margin) {
      continue;
    }

    // Depth for sorting
    obj._depth = computeScreenDepth(obj.worldX, obj.worldY, obj.worldZ, camX, camY);
    obj._screenX = screen.x;
    obj._screenY = screen.y;
    obj._scale = screen.scale;
    visible.push(obj);
  }

  // Sort by depth (far to near — paint back to front)
  visible.sort(function (a, b) { return b._depth - a._depth; });

  // Second pass: draw each visible object
  for (var v = 0; v < visible.length; v++) {
    var o = visible[v];
    ctx.save();
    drawSceneryObject(ctx, o, o._screenX, o._screenY, o._scale);
    ctx.restore();
  }
};

// ---------------------------------------------------------------------------
// drawSceneryObject — route to type-specific renderer
// ---------------------------------------------------------------------------
function drawSceneryObject(ctx, obj, sx, sy, scale) {
  switch (obj.type) {
    case 'building':
      drawBuilding(ctx, obj, sx, sy, scale);
      break;
    case 'tree':
      drawTree(ctx, obj, sx, sy, scale);
      break;
    case 'billboard':
      drawBillboard(ctx, obj, sx, sy, scale);
      break;
    case 'barrier':
      drawBarrier(ctx, obj, sx, sy, scale);
      break;
    case 'grandstand':
      drawGrandstand(ctx, obj, sx, sy, scale);
      break;
    default:
      break;
  }
}

// ---------------------------------------------------------------------------
// drawBuilding — rectangle body + windows + roof + shadow
// ---------------------------------------------------------------------------
function drawBuilding(ctx, obj, sx, sy, scale) {
  var w = obj.width * scale;
  var h = obj.height * scale;
  var x = sx - w * 0.5;
  var y = sy - h; // bottom-aligned at ground

  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.beginPath();
  ctx.ellipse(sx, sy, w * 0.55, w * 0.15, 0, 0, Math.PI * 2);
  ctx.fill();

  // Building body
  ctx.fillStyle = obj.color;
  ctx.fillRect(x, y, w, h);

  // Outline
  ctx.strokeStyle = 'rgba(0,0,0,0.3)';
  ctx.lineWidth = Math.max(1, scale * 1.5);
  ctx.strokeRect(x, y, w, h);

  // Windows
  var windowCols = Math.max(2, Math.floor(w / (10 * scale)));
  var windowRows = Math.max(2, Math.floor(h / (14 * scale)));
  if (windowCols < 1) windowCols = 1;
  if (windowRows < 1) windowRows = 1;
  var winW = (w * 0.7) / windowCols;
  var winH = (h * 0.6) / windowRows;
  var startX = x + w * 0.15;
  var startY = y + h * 0.1;

  // Seed deterministic per-building window pattern
  var seed = (obj.worldX * 31 + obj.worldY * 17) % 1000;

  for (var row = 0; row < windowRows; row++) {
    for (var col = 0; col < windowCols; col++) {
      var lit = ((seed + row * 7 + col * 13) % 5) < 3; // ~60% lit
      ctx.fillStyle = lit
        ? 'rgba(255,255,200,0.75)'
        : 'rgba(40,40,60,0.6)';
      var wx = startX + col * (winW + w * 0.02);
      var wy = startY + row * (winH + h * 0.03);
      ctx.fillRect(wx, wy, winW, winH);

      // Window frame
      ctx.strokeStyle = lit ? 'rgba(0,0,0,0.2)' : 'rgba(0,0,0,0.35)';
      ctx.lineWidth = Math.max(0.5, scale * 0.5);
      ctx.strokeRect(wx, wy, winW, winH);
    }
  }

  // Door
  var doorW = w * 0.18;
  var doorH = h * 0.25;
  var doorX = sx - doorW * 0.5;
  var doorY = sy - doorH;
  ctx.fillStyle = 'rgba(60,40,30,0.8)';
  ctx.fillRect(doorX, doorY, doorW, doorH);
  ctx.strokeStyle = 'rgba(0,0,0,0.4)';
  ctx.lineWidth = Math.max(0.5, scale * 0.7);
  ctx.strokeRect(doorX, doorY, doorW, doorH);
  // Doorknob
  ctx.fillStyle = 'rgba(200,180,100,0.7)';
  ctx.beginPath();
  ctx.arc(doorX + doorW * 0.8, doorY + doorH * 0.5, Math.max(1, scale * 1.5), 0, Math.PI * 2);
  ctx.fill();

  // Roof
  var roofH = h * 0.15;
  switch (obj.variant) {
    case 0: // flat roof — slightly wider
      ctx.fillStyle = randPick(ROOF_COLORS);
      ctx.fillRect(x - w * 0.05, y - roofH, w * 1.1, roofH);
      ctx.strokeStyle = 'rgba(0,0,0,0.3)';
      ctx.lineWidth = Math.max(0.5, scale * 0.7);
      ctx.strokeRect(x - w * 0.05, y - roofH, w * 1.1, roofH);
      break;

    case 1: // peaked roof (triangle)
      ctx.fillStyle = randPick(ROOF_COLORS);
      ctx.beginPath();
      ctx.moveTo(x - w * 0.08, y);
      ctx.lineTo(sx, y - roofH * 2);
      ctx.lineTo(x + w + w * 0.08, y);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,0.3)';
      ctx.lineWidth = Math.max(0.5, scale * 0.7);
      ctx.stroke();
      break;

    case 2: // wide building — flat with slight overhang
      ctx.fillStyle = randPick(ROOF_COLORS);
      ctx.fillRect(x - w * 0.08, y - roofH, w * 1.16, roofH);
      ctx.strokeStyle = 'rgba(0,0,0,0.25)';
      ctx.lineWidth = Math.max(0.5, scale * 0.5);
      ctx.strokeRect(x - w * 0.08, y - roofH, w * 1.16, roofH);
      break;

    case 3: // tall narrow — flat roof + chimney
      ctx.fillStyle = randPick(ROOF_COLORS);
      ctx.fillRect(x - w * 0.04, y - roofH, w * 1.08, roofH);
      ctx.strokeStyle = 'rgba(0,0,0,0.25)';
      ctx.lineWidth = Math.max(0.5, scale * 0.5);
      ctx.strokeRect(x - w * 0.04, y - roofH, w * 1.08, roofH);
      // Chimney
      var chimW = w * 0.12;
      var chimH = roofH * 3;
      ctx.fillStyle = '#8b4513';
      ctx.fillRect(x + w * 0.65, y - roofH - chimH, chimW, chimH);
      ctx.strokeStyle = 'rgba(0,0,0,0.3)';
      ctx.lineWidth = Math.max(0.3, scale * 0.4);
      ctx.strokeRect(x + w * 0.65, y - roofH - chimH, chimW, chimH);
      break;

    default:
      ctx.fillStyle = randPick(ROOF_COLORS);
      ctx.fillRect(x - w * 0.05, y - roofH, w * 1.1, roofH);
      break;
  }
}

// ---------------------------------------------------------------------------
// drawTree — circle canopy on brown trunk
// ---------------------------------------------------------------------------
function drawTree(ctx, obj, sx, sy, scale) {
  var w = obj.width * scale;
  var h = obj.height * scale;
  var trunkW = w * 0.2;
  var trunkH = h * 0.4;
  var canopyR = w * 0.5;

  // Rotation for slight lean
  var rot = obj.rotation || 0;

  ctx.save();
  if (rot !== 0) {
    ctx.translate(sx, sy);
    ctx.rotate(rot);
    ctx.translate(-sx, -sy);
  }

  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.2)';
  ctx.beginPath();
  ctx.ellipse(sx, sy, canopyR * 0.8, canopyR * 0.2, 0, 0, Math.PI * 2);
  ctx.fill();

  // Trunk
  var trunkX = sx - trunkW * 0.5;
  var trunkY = sy - trunkH - canopyR * 0.3;
  ctx.fillStyle = '#6b4226';
  ctx.fillRect(trunkX, trunkY, trunkW, trunkH);
  ctx.strokeStyle = 'rgba(0,0,0,0.2)';
  ctx.lineWidth = Math.max(0.5, scale * 0.5);
  ctx.strokeRect(trunkX, trunkY, trunkW, trunkH);

  // Canopy
  var canopyY = trunkY - canopyR * 0.5;
  var green = obj.color;

  switch (obj.variant) {
    case 0: // round canopy
      ctx.fillStyle = green;
      ctx.beginPath();
      ctx.arc(sx, canopyY, canopyR, 0, Math.PI * 2);
      ctx.fill();
      // Highlight
      ctx.fillStyle = 'rgba(255,255,255,0.12)';
      ctx.beginPath();
      ctx.arc(sx - canopyR * 0.2, canopyY - canopyR * 0.2, canopyR * 0.5, 0, Math.PI * 2);
      ctx.fill();
      // Outline
      ctx.strokeStyle = 'rgba(0,0,0,0.25)';
      ctx.lineWidth = Math.max(0.5, scale * 0.6);
      ctx.beginPath();
      ctx.arc(sx, canopyY, canopyR, 0, Math.PI * 2);
      ctx.stroke();
      break;

    case 1: // pine tree — triangular tiers
      var pineCY = trunkY - canopyR * 0.0;
      for (var tier = 0; tier < 3; tier++) {
        var tierW = canopyR * (1.2 - tier * 0.35);
        var tierH = canopyR * 0.8;
        var tierTopY = pineCY - tier * tierH * 0.5;
        ctx.fillStyle = tier === 0 ? green : shadeColor(green, -10 * tier);
        ctx.beginPath();
        ctx.moveTo(sx, tierTopY - tierH);
        ctx.lineTo(sx - tierW, tierTopY);
        ctx.lineTo(sx + tierW, tierTopY);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = 'rgba(0,0,0,0.2)';
        ctx.lineWidth = Math.max(0.5, scale * 0.4);
        ctx.stroke();
      }
      break;

    case 2: // double canopy — two overlapping circles
      var c1Y = canopyY - canopyR * 0.1;
      ctx.fillStyle = green;
      ctx.beginPath();
      ctx.arc(sx - canopyR * 0.25, c1Y, canopyR * 0.7, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = shadeColor(green, 10);
      ctx.beginPath();
      ctx.arc(sx + canopyR * 0.25, c1Y, canopyR * 0.65, 0, Math.PI * 2);
      ctx.fill();
      // Highlight
      ctx.fillStyle = 'rgba(255,255,255,0.1)';
      ctx.beginPath();
      ctx.arc(sx - canopyR * 0.35, c1Y - canopyR * 0.2, canopyR * 0.3, 0, Math.PI * 2);
      ctx.fill();
      break;

    default:
      ctx.fillStyle = green;
      ctx.beginPath();
      ctx.arc(sx, canopyY, canopyR, 0, Math.PI * 2);
      ctx.fill();
      break;
  }

  ctx.restore();
}

// ---------------------------------------------------------------------------
// drawBillboard — tall rectangle with colored ad
// ---------------------------------------------------------------------------
function drawBillboard(ctx, obj, sx, sy, scale) {
  var w = obj.width * scale;
  var h = obj.height * scale;
  var poleW = Math.max(2, w * 0.12);
  var poleH = h * 0.25;
  var boardH = h * 0.75;
  var x = sx - w * 0.5;
  var y = sy - h;

  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.2)';
  ctx.beginPath();
  ctx.ellipse(sx, sy, w * 0.45, w * 0.1, 0, 0, Math.PI * 2);
  ctx.fill();

  // Pole(s)
  ctx.fillStyle = '#555555';
  if (obj.variant === 0) {
    // Single center pole
    ctx.fillRect(sx - poleW * 0.5, sy - poleH, poleW, poleH);
  } else {
    // Double poles
    ctx.fillRect(x + w * 0.15, sy - poleH, poleW, poleH);
    ctx.fillRect(x + w * 0.85 - poleW, sy - poleH, poleW, poleH);
  }

  // Board background (white)
  var boardX = x;
  var boardY = y;
  ctx.fillStyle = '#f8f8f8';
  ctx.fillRect(boardX, boardY, w, boardH);

  // Colored ad panel (center portion)
  var adPadding = w * 0.08;
  var adX = boardX + adPadding;
  var adY = boardY + adPadding;
  var adW = w - adPadding * 2;
  var adH = boardH * 0.55;
  ctx.fillStyle = obj.color;
  ctx.fillRect(adX, adY, adW, adH);

  // "Text" lines on ad
  ctx.fillStyle = 'rgba(255,255,255,0.9)';
  var lineH = Math.max(1, adH * 0.08);
  var lines = 3;
  for (var li = 0; li < lines; li++) {
    var lw = adW * (0.5 + Math.random() * 0.4);
    var lx = adX + adW * 0.1;
    var ly = adY + adH * 0.25 + li * adH * 0.25;
    ctx.fillRect(lx, ly, lw, lineH);
  }

  // Bottom text area
  var bottomY = adY + adH + adPadding * 0.5;
  ctx.fillStyle = 'rgba(0,0,0,0.15)';
  ctx.fillRect(adX, bottomY, adW, Math.max(2, boardH * 0.12));

  // Border
  ctx.strokeStyle = 'rgba(0,0,0,0.4)';
  ctx.lineWidth = Math.max(1, scale * 1);
  ctx.strokeRect(boardX, boardY, w, boardH);
}

// ---------------------------------------------------------------------------
// drawBarrier — red-white striped rectangle
// ---------------------------------------------------------------------------
function drawBarrier(ctx, obj, sx, sy, scale) {
  var w = obj.width * scale;
  var h = obj.height * scale;
  var x = sx - w * 0.5;
  var y = sy - h;

  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.2)';
  ctx.beginPath();
  ctx.ellipse(sx, sy, w * 0.45, w * 0.08, 0, 0, Math.PI * 2);
  ctx.fill();

  // Barrier body with stripes
  var stripeCount = Math.max(2, Math.floor(w / (6 * scale)));
  var stripeW = w / stripeCount;

  ctx.strokeStyle = 'rgba(0,0,0,0.3)';
  ctx.lineWidth = Math.max(0.5, scale * 0.5);

  for (var s = 0; s < stripeCount; s++) {
    ctx.fillStyle = s % 2 === 0 ? '#cc0000' : '#ffffff';
    var sx2 = x + s * stripeW;
    ctx.fillRect(sx2, y, stripeW, h);
    ctx.strokeRect(sx2, y, stripeW, h);
  }
}

// ---------------------------------------------------------------------------
// drawGrandstand — multi-tier seating structure
// ---------------------------------------------------------------------------
function drawGrandstand(ctx, obj, sx, sy, scale) {
  var w = obj.width * scale;
  var h = obj.height * scale;
  var x = sx - w * 0.5;
  var y = sy - h;
  var tiers = 6;
  var tierH = h * 0.55 / tiers; // seating takes bottom 55%
  var roofH = h * 0.45;
  var tierOffset = w * 0.03;

  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.beginPath();
  ctx.ellipse(sx, sy, w * 0.6, w * 0.12, 0, 0, Math.PI * 2);
  ctx.fill();

  // Main structure
  ctx.fillStyle = '#888888';
  ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = 'rgba(0,0,0,0.4)';
  ctx.lineWidth = Math.max(1, scale * 1.5);
  ctx.strokeRect(x, y, w, h);

  // Seating tiers — each row a different color
  var tierColors = ['#cc3333', '#3366cc', '#33aa33', '#ccaa33', '#aa3366', '#33aaaa'];
  var baseY = y + roofH;
  for (var t = 0; t < tiers; t++) {
    var tw = w - t * tierOffset * 2; // each tier slightly narrower
    var tx = x + t * tierOffset;
    var ty = baseY + t * tierH;
    ctx.fillStyle = tierColors[t % tierColors.length];
    ctx.fillRect(tx, ty, tw, tierH);
    ctx.strokeStyle = 'rgba(0,0,0,0.3)';
    ctx.lineWidth = Math.max(0.5, scale * 0.4);
    ctx.strokeRect(tx, ty, tw, tierH);

    // Row of seat dots
    if (tw > 8 && tierH > 3) {
      var dotCount = Math.floor(tw / (3 * scale));
      var dotSpacing = tw / (dotCount + 1);
      ctx.fillStyle = 'rgba(255,255,255,0.3)';
      for (var d = 0; d < dotCount; d++) {
        var dx = tx + (d + 1) * dotSpacing;
        ctx.beginPath();
        ctx.arc(dx, ty + tierH * 0.5, Math.max(0.5, scale * 0.8), 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }

  // Roof
  ctx.fillStyle = '#666666';
  ctx.fillRect(x - w * 0.05, y, w * 1.1, roofH * 0.15);
  // Roof slant
  ctx.fillStyle = '#555555';
  ctx.beginPath();
  ctx.moveTo(x - w * 0.08, y + roofH * 0.15);
  ctx.lineTo(sx, y - roofH * 0.15);
  ctx.lineTo(x + w + w * 0.08, y + roofH * 0.15);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.4)';
  ctx.lineWidth = Math.max(0.5, scale * 0.6);
  ctx.stroke();

  // Support pillars
  var pillarW = Math.max(2, scale * 3);
  ctx.fillStyle = '#777777';
  ctx.fillRect(x + w * 0.05, y + roofH * 0.1, pillarW, h * 0.5);
  ctx.fillRect(x + w * 0.95 - pillarW, y + roofH * 0.1, pillarW, h * 0.5);
}

// ---------------------------------------------------------------------------
// R.renderCrowd — draw crowd dots in grandstand
// ---------------------------------------------------------------------------
R.renderCrowd = function (grandstandX, grandstandY) {
  var ctx = R.ctx;
  var cam = R.camera;
  var screen = R.worldToScreen
    ? R.worldToScreen(grandstandX, grandstandY, 0)
    : defaultWorldToScreen(grandstandX, grandstandY, 0, cam.x, cam.y, cam.zoom);

  if (!screen || !screen.visible) return;
  if (screen.x < -200 || screen.x > R.canvas.width + 200 ||
      screen.y < -200 || screen.y > R.canvas.height + 200) return;

  // Find main grandstand object for dimensions
  var gs = null;
  for (var i = 0; i < R.sceneryObjects.length; i++) {
    if (R.sceneryObjects[i].type === 'grandstand') {
      gs = R.sceneryObjects[i];
      break;
    }
  }
  if (!gs) return;

  var scale = screen.scale;
  var w = gs.width * scale;
  var h = gs.height * scale;
  var x = screen.x - w * 0.5;
  var y = screen.y - h;
  var roofH = h * 0.45;
  var tiers = 6;
  var tierH = h * 0.55 / tiers;
  var tierOffset = w * 0.03;
  var baseY = y + roofH;

  // Crowd dots per tier
  for (var t = 0; t < tiers; t++) {
    var tw = w - t * tierOffset * 2;
    var tx = x + t * tierOffset;
    var ty = baseY + t * tierH;
    var peoplePerRow = Math.floor(tw / Math.max(3, 4 * scale));
    if (peoplePerRow < 1) peoplePerRow = 1;

    // Seed based on tier
    var seed = t * 137 + 42;

    for (var p = 0; p < peoplePerRow; p++) {
      var px = tx + tw * (p + 0.5) / peoplePerRow;
      var py = ty + tierH * 0.35;
      // Skip some seats for natural look
      if (((seed + p * 11) % 7) === 0) continue;

      // Small person dot
      var skin = SKIN_TONES[(seed + p * 3) % SKIN_TONES.length];
      var shirt = SHIRT_COLORS[(seed + p * 7) % SHIRT_COLORS.length];
      var dotR = Math.max(1.2, scale * 1.8);

      // Head
      ctx.fillStyle = skin;
      ctx.beginPath();
      ctx.arc(px, py - dotR * 0.4, dotR * 0.6, 0, Math.PI * 2);
      ctx.fill();

      // Body
      ctx.fillStyle = shirt;
      ctx.fillRect(px - dotR * 0.4, py, dotR * 0.8, dotR * 0.9);
    }
  }
};

// ---------------------------------------------------------------------------
// Helper: shade a hex color darker or lighter
// ---------------------------------------------------------------------------
function shadeColor(color, percent) {
  var num = parseInt(color.replace('#', ''), 16);
  var amt = Math.round(2.55 * percent);
  var R = (num >> 16) + amt;
  var G = ((num >> 8) & 0x00ff) + amt;
  var B = (num & 0x0000ff) + amt;
  R = R < 0 ? 0 : R > 255 ? 255 : R;
  G = G < 0 ? 0 : G > 255 ? 255 : G;
  B = B < 0 ? 0 : B > 255 ? 255 : B;
  return '#' + (0x1000000 + R * 0x10000 + G * 0x100 + B).toString(16).slice(1);
}

// ---------------------------------------------------------------------------
// Helper: default world-to-screen projection (fallback if R.worldToScreen is
// not yet defined). Uses simple perspective projection with camera offset.
// ---------------------------------------------------------------------------
function defaultWorldToScreen(wx, wy, wz, camX, camY, zoom) {
  var canvasW = R.canvas.width;
  var canvasH = R.canvas.height;
  var cx = canvasW * 0.5;
  var cy = canvasH * 0.4; // horizon line

  // World offset relative to camera
  var rx = wx - camX;
  var ry = wy - camY;
  var rz = wz; // elevation

  // Simple perspective: farther objects appear higher and smaller
  var perspectiveFactor = 1;
  if (ry > 1) {
    perspectiveFactor = 300 / ry;
  } else {
    perspectiveFactor = 1;
  }

  var scale = perspectiveFactor * zoom;
  var sx = cx + rx * perspectiveFactor * zoom;
  var sy = cy - rz * perspectiveFactor * zoom + perspectiveFactor * zoom * 50;

  // Visibility check
  var visible = perspectiveFactor > 0.01 && perspectiveFactor < 2.0;
  if (ry <= 0) visible = false;

  return { x: sx, y: sy, scale: scale, visible: visible };
}

// ---------------------------------------------------------------------------
// Exported interface:
//   R.CONFIG.SCENERY_OBJECTS          — target count for scenery generation
//   R.CONFIG.SCENERY_CULL_DISTANCE    — max screen distance for drawing
//   R.CONFIG.SCENERY_CULL_MARGIN      — extra margin beyond viewport
//   R.CONFIG.SCENERY_SEGMENT_STEP     — segments between scenery placements
//   R.CONFIG.SCENERY_TRACK_EDGE_*     — offset range from track edge
//   R.CONFIG.SCENERY_BUILDING_CLUSTER_RANGE — urban zone radius
//   R.sceneryObjects                  — array of scenery objects
//   R.initScenery()                   — generate scenery along track
//   R.renderScenery()                 — render visible scenery each frame
//   R.renderCrowd(gx, gy)             — draw crowd dots in grandstand
// ---------------------------------------------------------------------------

</script>

/* =========================== Internal Helpers =========================== */

/**

 * @param {CanvasRenderingContext2D} ctx
 * @param {number} x
