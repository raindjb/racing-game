<script>
// === collision.js — Racing Game ===
// Car-to-car and car-to-track collision detection and response.
// Uses AABB broad phase + SAT narrow phase for rotated-rect car bodies.
// Off-track detection with graduated friction penalties.

// ─── Constants (extend R.CONFIG) ───────────────────────────────────────────

R.CONFIG.CAR_WIDTH            = R.CONFIG.CAR_WIDTH            || 40;
R.CONFIG.CAR_HEIGHT           = R.CONFIG.CAR_HEIGHT           || 70;
R.CONFIG.COLLISION_DAMPING    = R.CONFIG.COLLISION_DAMPING    || 0.7;
R.CONFIG.COLLISION_SPEED_LOSS = R.CONFIG.COLLISION_SPEED_LOSS || 0.85;
R.CONFIG.OFFROAD_FRICTION     = R.CONFIG.OFFROAD_FRICTION     || 0.92;
R.CONFIG.OFFROAD_DEEP_PENALTY = R.CONFIG.OFFROAD_DEEP_PENALTY || 0.80;
R.CONFIG.OFFROAD_DEEP_THRESH  = R.CONFIG.OFFROAD_DEEP_THRESH  || 50;
R.CONFIG.MIN_SPEED            = R.CONFIG.MIN_SPEED            || 0.5;
R.CONFIG.MIN_COLLISION_SPEED  = R.CONFIG.MIN_COLLISION_SPEED  || 2.0;
R.CONFIG.SPARK_SPEED_THRESH   = R.CONFIG.SPARK_SPEED_THRESH   || 4.0;
R.CONFIG.MAX_SIMULTANEOUS     = R.CONFIG.MAX_SIMULTANEOUS     || 8;

// ─── Helpers ───────────────────────────────────────────────────────────────

/**
 * Rotate a point (px, py) around origin (ox, oy) by angle (radians).
 */
R._rotatePoint = function(px, py, ox, oy, angle) {
  const cos = Math.cos(angle);
  const sin = Math.sin(angle);
  const dx = px - ox;
  const dy = py - oy;
  return {
    x: ox + dx * cos - dy * sin,
    y: oy + dx * sin + dy * cos
  };
};

/**
 * Project polygon points onto an axis. Returns { min, max }.
 */
R._projectPolygon = function(points, axisX, axisY) {
  let min = Infinity;
  let max = -Infinity;
  for (let i = 0; i < points.length; i++) {
    const dot = points[i].x * axisX + points[i].y * axisY;
    if (dot < min) min = dot;
    if (dot > max) max = dot;
  }
  return { min, max };
};

/**
 * Get the 4 corner points of a car as a rotated rectangle.
 * Car origin (x, y) is the center of the rectangle.
 */
R._getCarCorners = function(car) {
  const hw = R.CONFIG.CAR_WIDTH * 0.5;
  const hh = R.CONFIG.CAR_HEIGHT * 0.5;
  const cx = car.x;
  const cy = car.y;
  const angle = car.angle || 0;

  const local = [
    { x: -hw, y: -hh },
    { x:  hw, y: -hh },
    { x:  hw, y:  hh },
    { x: -hw, y:  hh }
  ];

  const corners = [];
  for (let i = 0; i < 4; i++) {
    corners.push(R._rotatePoint(
      cx + local[i].x, cy + local[i].y, cx, cy, angle
    ));
  }
  return corners;
};

/**
 * Get edge normals of a polygon for SAT (perpendicular to each edge, normalized).
 */
R._getNormals = function(corners) {
  const normals = [];
  for (let i = 0; i < corners.length; i++) {
    const j = (i + 1) % corners.length;
    const edgeX = corners[j].x - corners[i].x;
    const edgeY = corners[j].y - corners[i].y;
    const len = Math.sqrt(edgeX * edgeX + edgeY * edgeY);
    if (len < 0.0001) continue;
    normals.push({ x: -edgeY / len, y: edgeX / len });
  }
  return normals;
};

/**
 * Overlap amount on an axis between two projections.
 * Positive = overlapping, negative/zero = separated.
 */
R._overlapOnAxis = function(projA, projB) {
  return Math.min(projA.max, projB.max) - Math.max(projA.min, projB.min);
};

// ─── AABB ───────────────────────────────────────────────────────────────────

/**
 * Axis-aligned bounding box for a car. Uses max extent of the rotated rectangle
 * (a conservative circle-bounds approximation).
 *
 * @param {Object} car — { x, y, angle }
 * @returns {{ minX: number, maxX: number, minY: number, maxY: number }}
 */
R.carAABB = function(car) {
  const hw = R.CONFIG.CAR_WIDTH * 0.5;
  const hh = R.CONFIG.CAR_HEIGHT * 0.5;
  const angle = car.angle || 0;
  const absCos = Math.abs(Math.cos(angle));
  const absSin = Math.abs(Math.sin(angle));
  const radiusX = hw * absCos + hh * absSin;
  const radiusY = hw * absSin + hh * absCos;

  return {
    minX: car.x - radiusX,
    maxX: car.x + radiusX,
    minY: car.y - radiusY,
    maxY: car.y + radiusY
  };
};

/**
 * Test if two AABBs overlap.
 */
R._aabbOverlap = function(a, b) {
  return a.minX < b.maxX && a.maxX > b.minX && a.minY < b.maxY && a.maxY > b.minY;
};

// ─── Car-to-Car Collision (SAT) ─────────────────────────────────────────────

/**
 * Detailed collision detection between two cars using Separating Axis Theorem.
 * Each car is a 40x70 rotated rectangle.
 *
 * @param {Object} carA
 * @param {Object} carB
 * @returns {{ hit: boolean, overlapX: number, overlapY: number, depth: number } | null}
 */
R.checkCarToCar = function(carA, carB) {
  // Broad phase: AABB
  if (!R._aabbOverlap(R.carAABB(carA), R.carAABB(carB))) {
    return null;
  }

  // Narrow phase: SAT
  const cornersA = R._getCarCorners(carA);
  const cornersB = R._getCarCorners(carB);
  const axes = R._getNormals(cornersA).concat(R._getNormals(cornersB));

  let minOverlap = Infinity;
  let minAxisX = 0;
  let minAxisY = 0;

  for (let i = 0; i < axes.length; i++) {
    const ax = axes[i].x;
    const ay = axes[i].y;
    const projA = R._projectPolygon(cornersA, ax, ay);
    const projB = R._projectPolygon(cornersB, ax, ay);
    const overlap = R._overlapOnAxis(projA, projB);

    if (overlap <= 0) return null; // separating axis found

    if (overlap < minOverlap) {
      minOverlap = overlap;
      minAxisX = ax;
      minAxisY = ay;
    }
  }

  return {
    hit: true,
    overlapX: minAxisX * minOverlap,
    overlapY: minAxisY * minOverlap,
    depth: minOverlap
  };
};

// ─── Collision Resolution ───────────────────────────────────────────────────

/**
 * Resolve a collision between two cars: push apart and adjust velocities.
 *
 * Push ratios:
 *   - Both moving: 50% each
 *   - One stationary (speed < MIN_SPEED): stationary car gets 70% push,
 *     moving car takes 30%
 *
 * Velocity impulse:
 *   - Relative velocity along collision normal
 *   - Equal-mass damped exchange
 *   - COLLISION_DAMPING applied to both cars' speed
 *
 * @param {Object} carA
 * @param {Object} carB
 * @param {{ overlapX: number, overlapY: number, depth: number }} overlap
 */
R.resolveCollision = function(carA, carB, overlap) {
  const depth = overlap.depth;
  if (depth <= 0) return;

  const speedA = Math.abs(carA.speed || 0);
  const speedB = Math.abs(carB.speed || 0);
  const aStationary = speedA < R.CONFIG.MIN_SPEED;
  const bStationary = speedB < R.CONFIG.MIN_SPEED;

  // Determine push ratios
  let pushRatioA, pushRatioB;
  if (aStationary && !bStationary) {
    pushRatioA = 0.7; pushRatioB = 0.3;
  } else if (bStationary && !aStationary) {
    pushRatioA = 0.3; pushRatioB = 0.7;
  } else {
    pushRatioA = 0.5; pushRatioB = 0.5;
  }

  // Push apart
  carA.x -= overlap.overlapX * pushRatioA;
  carA.y -= overlap.overlapY * pushRatioA;
  carB.x += overlap.overlapX * pushRatioB;
  carB.y += overlap.overlapY * pushRatioB;

  // Velocity exchange
  const nx = overlap.overlapX / (depth || 0.001);
  const ny = overlap.overlapY / (depth || 0.001);

  const vAx = Math.cos(carA.angle || 0) * (carA.speed || 0);
  const vAy = Math.sin(carA.angle || 0) * (carA.speed || 0);
  const vBx = Math.cos(carB.angle || 0) * (carB.speed || 0);
  const vBy = Math.sin(carB.angle || 0) * (carB.speed || 0);

  const relVelN = (vAx - vBx) * nx + (vAy - vBy) * ny;

  // Only resolve if cars are approaching
  if (relVelN > 0) {
    if (!aStationary && !bStationary) {
      // Equal-mass damped exchange: each car moves toward average speed
      const avgSpeed = (carA.speed + carB.speed) / 2;
      carA.speed = avgSpeed - (carA.speed - avgSpeed) * R.CONFIG.COLLISION_DAMPING;
      carB.speed = avgSpeed - (carB.speed - avgSpeed) * R.CONFIG.COLLISION_DAMPING;
    } else if (aStationary) {
      carB.speed *= R.CONFIG.COLLISION_SPEED_LOSS;
      carA.speed = carB.speed * (1 - R.CONFIG.COLLISION_DAMPING) * 0.3;
    } else {
      carA.speed *= R.CONFIG.COLLISION_SPEED_LOSS;
      carB.speed = carA.speed * (1 - R.CONFIG.COLLISION_DAMPING) * 0.3;
    }

    // Both lose energy
    carA.speed *= R.CONFIG.COLLISION_DAMPING;
    carB.speed *= R.CONFIG.COLLISION_DAMPING;
  }

  // Clamp tiny speeds to zero
  if (Math.abs(carA.speed) < R.CONFIG.MIN_SPEED * 0.5) carA.speed = 0;
  if (Math.abs(carB.speed) < R.CONFIG.MIN_SPEED * 0.5) carB.speed = 0;
};

// ─── Boundary Checking ──────────────────────────────────────────────────────

/**
 * Check if a car is off the track and apply penalties.
 *
 * - Uses R.isOnTrack(car.x, car.z) to determine track position
 * - Off track: applies OFFROAD_FRICTION (shallow) or OFFROAD_DEEP_PENALTY (deep)
 * - Deep off track (>50px from edge) + speed > 3: aggressive speed reduction
 * - Spawns dust particles via R.spawnDust()
 * - Sets car._offRoadSteerScale = 0.6 for reduced steering control
 *
 * @param {Object} car
 * @param {number} dt — delta time (seconds), unused but accepted for API compatibility
 */
R.checkCarToBoundary = function(car, dt) {
  if (typeof R.isOnTrack !== 'function') return;

  const carZ = (car.z !== undefined) ? car.z : 0;
  if (R.isOnTrack(car.x, carZ)) {
    car._offTrack = false;
    car._offTrackDepth = 0;
    car._offRoadSteerScale = 1;
    return;
  }

  // Off track — determine depth
  car._offTrack = true;
  const testOffset = R.CONFIG.OFFROAD_DEEP_THRESH;
  let deepOff;

  if (typeof R.isOnTrack === 'function') {
    const probeX = car.x + (car.x > 0 ? -testOffset : testOffset);
    deepOff = !R.isOnTrack(probeX, carZ);
  } else {
    deepOff = false;
  }

  car._offTrackDepth = deepOff ? R.CONFIG.OFFROAD_DEEP_THRESH + 1 : 30;

  // Apply friction
  const friction = deepOff ? R.CONFIG.OFFROAD_DEEP_PENALTY : R.CONFIG.OFFROAD_FRICTION;
  car.speed *= friction;

  // Aggressive scrubbing for fast cars deep off track
  if (deepOff && Math.abs(car.speed) > 3) {
    car.speed *= R.CONFIG.OFFROAD_DEEP_PENALTY;
  }

  if (Math.abs(car.speed) < R.CONFIG.MIN_SPEED * 0.3) {
    car.speed = 0;
  }

  // Dust particles
  if (typeof R.spawnDust === 'function' && Math.abs(car.speed) > 0.5) {
    R.spawnDust(car.x, car.y, deepOff ? 4 : 2);
  }

  // Reduced steering off-road
  car._offRoadSteerScale = 0.6;
};

// ─── Per-Frame Collision Check ──────────────────────────────────────────────

/**
 * Main entry point. Called each frame during 'racing' phase.
 *
 * Pipeline:
 *   1. Gather active cars (player + AI)
 *   2. AABB broad phase → candidate pairs
 *   3. SAT narrow phase → confirmed collisions
 *   4. Sort by overlap depth (deepest first)
 *   5. Resolve each collision (push apart + impulse + effects)
 *   6. Re-check boundaries for all cars (collisions may push cars off track)
 *
 * Edge cases handled:
 *   - Multiple simultaneous collisions: resolved in depth order, max per car = 3
 *   - Very slow collisions: no sparks/sound, just positional nudging
 *   - One car stationary: push ratio biased toward stationary car
 *   - Car pushed off track: boundary re-check after resolution
 */

// Debug/metrics (populated each frame)
R._lastCollisionInfo = null;
R._collisionCountThisFrame = 0;

R.checkCollisions = function() {
  R._collisionCountThisFrame = 0;
  R._lastCollisionInfo = null;

  if (R.state.phase !== 'racing') return;

  // 1. Gather cars
  const cars = [];
  if (R.playerCar) cars.push(R.playerCar);
  if (R.aiCars && R.aiCars.length > 0) {
    for (let i = 0; i < R.aiCars.length; i++) cars.push(R.aiCars[i]);
  }

  if (cars.length < 2) {
    for (let i = 0; i < cars.length; i++) R.checkCarToBoundary(cars[i], 0.016);
    return;
  }

  // 2. AABB broad phase
  const aabbs = [];
  for (let i = 0; i < cars.length; i++) aabbs.push(R.carAABB(cars[i]));

  const candidates = [];
  for (let i = 0; i < cars.length; i++) {
    for (let j = i + 1; j < cars.length; j++) {
      if (R._aabbOverlap(aabbs[i], aabbs[j])) {
        candidates.push({ a: cars[i], b: cars[j] });
      }
    }
  }

  if (candidates.length === 0) {
    for (let i = 0; i < cars.length; i++) R.checkCarToBoundary(cars[i], 0.016);
    return;
  }

  // 3. SAT narrow phase
  const collisions = [];
  for (let k = 0; k < candidates.length; k++) {
    const { a, b } = candidates[k];
    const result = R.checkCarToCar(a, b);
    if (result && result.hit) {
      collisions.push({ carA: a, carB: b, overlap: result, depth: result.depth });
    }
  }

  R._collisionCountThisFrame = collisions.length;
  if (collisions.length === 0) {
    for (let i = 0; i < cars.length; i++) R.checkCarToBoundary(cars[i], 0.016);
    return;
  }

  // 4. Sort deepest first
  collisions.sort(function(c1, c2) { return c2.depth - c1.depth; });

  // 5. Resolve collisions
  const maxResolve = Math.min(collisions.length, R.CONFIG.MAX_SIMULTANEOUS);
  const resolvedCars = {};
  const involvedCarKeys = [];

  for (let k = 0; k < maxResolve; k++) {
    const col = collisions[k];

    const keyA = col.carA._id || 'player';
    const keyB = col.carB._id || 'ai_' + R.aiCars.indexOf(col.carB);

    resolvedCars[keyA] = (resolvedCars[keyA] || 0) + 1;
    resolvedCars[keyB] = (resolvedCars[keyB] || 0) + 1;

    // Limit per-car resolutions to prevent jitter
    if (resolvedCars[keyA] > 3 || resolvedCars[keyB] > 3) continue;

    const speedA = Math.abs(col.carA.speed || 0);
    const speedB = Math.abs(col.carB.speed || 0);
    const avgSpeed = (speedA + speedB) / 2;

    // Resolve
    R.resolveCollision(col.carA, col.carB, col.overlap);

    // Effects
    const midpointX = (col.carA.x + col.carB.x) / 2;
    const midpointY = (col.carA.y + col.carB.y) / 2;

    if (avgSpeed > R.CONFIG.SPARK_SPEED_THRESH) {
      const intensity = Math.min(avgSpeed / 20, 1);
      if (typeof R.spawnSparks === 'function') R.spawnSparks(midpointX, midpointY, intensity);
      if (typeof R.playSound === 'function') R.playSound('crash', intensity);
    } else if (avgSpeed > R.CONFIG.MIN_COLLISION_SPEED) {
      const intensity = avgSpeed / R.CONFIG.SPARK_SPEED_THRESH * 0.5;
      if (typeof R.spawnSparks === 'function') R.spawnSparks(midpointX, midpointY, intensity);
      if (typeof R.playSound === 'function') R.playSound('crash', intensity * 0.3);
    }
    // Below MIN_COLLISION_SPEED: no effects, just nudging

    R._lastCollisionInfo = { carA: keyA, carB: keyB, depth: col.depth, avgSpeed: avgSpeed };

    if (involvedCarKeys.indexOf(keyA) === -1) involvedCarKeys.push(keyA);
    if (involvedCarKeys.indexOf(keyB) === -1) involvedCarKeys.push(keyB);
  }

  // 6. Boundary re-check for all cars (collisions may have pushed cars off track)
  const boundaryChecked = {};

  // Check involved cars first
  for (let k = 0; k < maxResolve; k++) {
    const col = collisions[k];
    const keyA = col.carA._id || 'player';

    }

      boundaryChecked[keyB] = true;
    }

      var sy = segs[i].worldY || 0;

      if (sx > maxX) maxX = sx;
      if (sy < minY) minY = sy;
      if (sy > maxY) maxY = sy;

    var rangeY = maxY - minY || 1;

    minY -= pad; maxY += pad;
    rangeX = maxX - minX;
    rangeY = maxY - minY;
    maxRange = Math.max(rangeX, rangeY);

    var margin = 12;
    var drawW  = w - margin * 2;
    var drawH  = h - margin * 2;
    var scale  = Math.min(drawW / maxRange, drawH / maxRange);

    // Center offset
    var cxOff = margin + (drawW - rangeX * scale) / 2 - minX * scale;
    var cyOff = margin + (drawH - rangeY * scale) / 2 - minY * scale;

    function toMapX(wx) { return cxOff + wx * scale; }
    function toMapY(wy) { return cyOff + wy * scale; }

    // Draw track outline — thin polyline with subtle gradient segments
    mCtx.lineWidth = 2;
    mCtx.lineCap   = 'round';
    mCtx.lineJoin  = 'round';

    for (var tSeg = 1; tSeg < points.length; tSeg++) {
      var p0 = points[tSeg - 1];
      var p1 = points[tSeg];
      var x0 = toMapX(p0.x), y0 = toMapY(p0.y);
      var x1 = toMapX(p1.x), y1 = toMapY(p1.y);

      // Gradient based on track progress (lighter at start, dimmer toward end)
      var frac = tSeg / points.length;
      var gAlpha = 0.25 + frac * 0.35;

      mCtx.beginPath();
      mCtx.moveTo(x0, y0);
      mCtx.lineTo(x1, y1);
      mCtx.strokeStyle = 'rgba(255,255,255,' + gAlpha.toFixed(2) + ')';
      mCtx.stroke();
    }

    // Draw road width as subtle parallel lines
    mCtx.lineWidth = 1;
    for (var rSeg = 1; rSeg < points.length; rSeg++) {
      var rp0 = points[rSeg - 1];
      var rp1 = points[rSeg];
      var segW = (rp0.width || 30) * scale * 0.3;
      var dx = rp1.x - rp0.x;
      var dy = rp1.y - rp0.y;
      var len = Math.sqrt(dx * dx + dy * dy) || 1;
      var nx = -dy / len * segW;
      var ny =  dx / len * segW;

      var mx0L = toMapX(rp0.x) + nx, my0L = toMapY(rp0.y) + ny;
      var mx0R = toMapX(rp0.x) - nx, my0R = toMapY(rp0.y) - ny;
      var mx1L = toMapX(rp1.x) + nx, my1L = toMapY(rp1.y) + ny;
      var mx1R = toMapX(rp1.x) - nx, my1R = toMapY(rp1.y) - ny;

      mCtx.strokeStyle = 'rgba(255,255,255,0.1)';
      mCtx.beginPath();
      mCtx.moveTo(mx0L, my0L); mCtx.lineTo(mx1L, my1L);
      mCtx.moveTo(mx0R, my0R); mCtx.lineTo(mx1R, my1R);
      mCtx.stroke();
    }

    // Draw all cars as dots
    var cars = R.cars || [];
    var playerIdx = -1;
    for (var c = 0; c < cars.length; c++) {
      if (cars[c] === R.player) { playerIdx = c; break; }
    }

    for (var ci = 0; ci < cars.length; ci++) {
      var car = cars[ci];
      var cmx = toMapX(car.x || 0);
      var cmy = toMapY(car.y || 0);

      if (ci === playerIdx) continue; // player drawn last

      mCtx.beginPath();
      mCtx.arc(cmx, cmy, 3, 0, Math.PI * 2);
      mCtx.fillStyle = car.color || '#aaaaaa';
      mCtx.fill();
      mCtx.strokeStyle = 'rgba(0,0,0,0.5)';
      mCtx.lineWidth = 0.8;
      mCtx.stroke();
    }

    // Draw player car as larger pulsing dot
    if (playerIdx >= 0 && R.player) {
      var pmx = toMapX(R.player.x || 0);
      var pmy = toMapY(R.player.y || 0);
      var pulse = 1 + Math.sin(R.state.time * 5) * 0.25;
      var pRad  = 5.5 * pulse;

      // Outer glow
      mCtx.beginPath();
      mCtx.arc(pmx, pmy, pRad + 3, 0, Math.PI * 2);
      mCtx.fillStyle = 'rgba(255,255,100,0.15)';
      mCtx.fill();

      // Main dot
      mCtx.beginPath();
      mCtx.arc(pmx, pmy, pRad, 0, Math.PI * 2);
      mCtx.fillStyle = '#ffff44';
      mCtx.fill();
      mCtx.strokeStyle = '#ffffff';
      mCtx.lineWidth = 1.2;
      mCtx.stroke();
    }

    // Draw to screen
    ctx.drawImage(_minimapCanvas, mx, my);

    // "MAP" label above the minimap
    ctx.font         = 'bold 10px Arial, sans-serif';
    ctx.fillStyle    = 'rgba(255,255,255,0.4)';
    ctx.textAlign    = 'left';
    ctx.textBaseline = 'bottom';
    ctx.fillText('MAP', mx + 2, my - 3);
  };

  // ── Race Timer ──────────────────────────────────────────────────────

  /**
   * R.renderRaceTimer()
   * Top-center. Large monospace digits: "1:23.456". Below: best lap.
   */
  R.renderRaceTimer = function () {
    var ctx = R.ctx;
    var tx  = CFG.HUD.TIMER_X;
    var ty  = CFG.HUD.TIMER_Y;

    var timeSec = R.state ? R.state.time : 0;

    // Format as M:SS.mmm
    var minutes = Math.floor(timeSec / 60);
    var seconds = Math.floor(timeSec % 60);
    var millis  = Math.floor((timeSec % 1) * 1000);
    var timeStr = minutes + ':' +
      (seconds < 10 ? '0' : '') + seconds + '.' +
      (millis < 100 ? (millis < 10 ? '00' : '0') : '') + millis;

    ctx.save();

    // Timer background panel
    var panelW = 200;
    var panelH = 52;
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.strokeStyle = 'rgba(255,255,255,0.15)';
    ctx.lineWidth = 1;
    R._roundRect(ctx, tx - panelW / 2, ty, panelW, panelH, 6);

    // Timer digits
    ctx.font         = 'bold 30px "Courier New", monospace';
    ctx.fillStyle    = '#ffffff';
    ctx.textAlign    = 'center';
    ctx.textBaseline = 'top';
    ctx.lineWidth    = 3;
    ctx.strokeStyle  = 'rgba(0,0,0,0.65)';
    ctx.strokeText(timeStr, tx, ty + 4);
    ctx.fillText(timeStr, tx, ty + 4);

    // Best lap
    if (_bestLapTime != null) {
      var bMin = Math.floor(_bestLapTime / 60);
      var bSec = Math.floor(_bestLapTime % 60);
      var bMil = Math.floor((_bestLapTime % 1) * 1000);
      var bestStr = 'BEST: ' + bMin + ':' +
        (bSec < 10 ? '0' : '') + bSec + '.' +
        (bMil < 100 ? (bMil < 10 ? '00' : '0') : '') + bMil;

      ctx.font         = 'bold 12px "Courier New", monospace';
      ctx.fillStyle    = '#ffcc00';
      ctx.textBaseline = 'top';
      ctx.lineWidth    = 1.5;
      ctx.strokeStyle  = 'rgba(0,0,0,0.6)';
      ctx.strokeText(bestStr, tx, ty + 38);
      ctx.fillText(bestStr, tx, ty + 38);
    }

    ctx.restore();
  };

  // ── Drift Indicator ─────────────────────────────────────────────────

  /**
   * R.renderDriftIndicator()
   * Bottom-center. Horizontal bar showing lateral G-force / drift.
   * Center = no drift. Extends left/right based on drift direction.
   */
  R.renderDriftIndicator = function () {
    var ctx = R.ctx;
    var dx  = CFG.HUD.DRIFT_X;
    var dy  = CFG.HUD.DRIFT_Y;
    var bw  = CFG.HUD.DRIFT_BAR_WIDTH;
    var bh  = CFG.HUD.DRIFT_BAR_HEIGHT;

    var player = R.player;
    if (!player) return;

    // Drift amount: use driftFactor or compute from speed & steer angle
    var driftAmt = 0;
    if (player.driftFactor !== undefined) {
      driftAmt = player.driftFactor;
    } else {
      // Approximate drift from steer angle and speed
      var steer = R.input ? R.input.steer : 0;
      var spd   = player.speed || 0;
      var maxSpd = player.maxSpeed || 200;
      driftAmt = steer * Math.min(spd / (maxSpd * 0.3), 1);
    }
    // Clamp to [-1, 1]
    driftAmt = Math.max(-1, Math.min(1, driftAmt));

    var absDrift = Math.abs(driftAmt);
    var barHalf  = bw / 2;

    ctx.save();

    // Background bar (dark)
    var bgX = dx - barHalf;
    var bgY = dy;
    ctx.fillStyle = 'rgba(30,30,30,0.7)';
    ctx.strokeStyle = 'rgba(255,255,255,0.15)';
    ctx.lineWidth = 1;
    R._roundRect(ctx, bgX, bgY, bw, bh, bh / 2);

    // Center notch
    ctx.beginPath();
    ctx.moveTo(dx, bgY - 3);
    ctx.lineTo(dx, bgY + bh + 3);
    ctx.strokeStyle = 'rgba(255,255,255,0.35)';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // Active drift fill
    if (absDrift > 0.005) {
      // Color based on drift intensity
      var r, g, bVal;
      if (absDrift < 0.4) {
        // white → yellow
        var t = absDrift / 0.4;
        r = 255;
        g = 255 - t * 55;
        bVal = 255 - t * 200;
      } else if (absDrift < 0.75) {
        // yellow → orange
        var t2 = (absDrift - 0.4) / 0.35;
        r = 255;
        g = 200 - t2 * 100;
        bVal = 55 - t2 * 55;
      } else {
        // orange
        r = 255;
        g = 100;
        bVal = 0;
      }
      var driftColor = 'rgb(' + Math.round(r) + ',' + Math.round(g) + ',' + Math.round(bVal) + ')';

      var fillHalf = barHalf * absDrift;
      var fillX, fillW;

      if (driftAmt > 0) {
        // Drift right
        fillX = dx;
        fillW = fillHalf;
      } else {
        // Drift left
        fillX = dx - fillHalf;
        fillW = fillHalf;
      }

      ctx.save();
      ctx.beginPath();
      R._roundRectPath(ctx, bgX, bgY, bw, bh, bh / 2);
      ctx.clip();
      ctx.fillStyle = driftColor;
      R._roundRect(ctx, fillX, bgY, fillW, bh, bh / 2);
      ctx.restore();
    }

    // "DRIFT" label below bar
    ctx.font         = 'bold 10px Arial, sans-serif';
    ctx.fillStyle    = 'rgba(255,255,255,0.5)';
    ctx.textAlign    = 'center';
    ctx.textBaseline = 'top';
    ctx.fillText('DRIFT', dx, bgY + bh + 3);

    ctx.restore();
  };

  // ── Countdown ───────────────────────────────────────────────────────

  /**
   * R.renderCountdown(number)
   * Large centered number during countdown phase.
   * Animate: scale from 2→1 over 0.8s with easing.
   * @param {number} num — the countdown number to display
   */
  R.renderCountdown = function (num) {
    var ctx  = R.ctx;
    var elapsed  = _countdownElapsed;
    var duration = CFG.HUD.COUNTDOWN_DURATION;

    // Easing: cubic ease-out
    var t   = Math.min(elapsed / duration, 1);
    var scale = 2 - t * t * (3 - 2 * t); // ease-out cubic: goes from 2→1

    var cx = (R.canvas ? R.canvas.width  : 1280) / 2;
    var cy = (R.canvas ? R.canvas.height : 720)  / 2;

    // Dark backdrop
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.fillRect(cx - 200, cy - 150, 400, 200);

    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(scale, scale);

    // Glow
    ctx.shadowColor  = 'rgba(255,255,255,0.5)';
    ctx.shadowBlur   = 30 * scale;

    var text = String(num);
    ctx.font         = 'bold 140px Arial, sans-serif';
    ctx.fillStyle    = '#ffffff';
    ctx.textAlign    = 'center';
    ctx.textBaseline = 'middle';

    // Outline
    ctx.strokeStyle  = 'rgba(0,0,0,0.6)';
    ctx.lineWidth    = 8;
    ctx.strokeText(text, 0, 0);
    ctx.fillText(text, 0, 0);

    ctx.shadowBlur = 0;
    ctx.restore();
  };

  /**
   * Internal helper: trigger a new countdown number.
   * Called externally by the game engine when countdown ticks.
   */
  R.triggerCountdown = function (number) {
    _countdownNumber   = number;
    _countdownElapsed  = 0;
    _countdownActive   = true;
  };

  // ── Menu Prompt ─────────────────────────────────────────────────────

  /**
   * R._renderMenuPrompt()
   * Internal: render the start prompt on the menu screen.
   */
  R._renderMenuPrompt = function () {
    var ctx = R.ctx;
    var cw  = R.canvas ? R.canvas.width  : 1280;
    var ch  = R.canvas ? R.canvas.height : 720;

    ctx.save();

    // Semi-transparent backdrop over lower half
    var grad = ctx.createLinearGradient(0, ch * 0.55, 0, ch);
    grad.addColorStop(0, 'rgba(0,0,0,0)');
    grad.addColorStop(1, 'rgba(0,0,0,0.6)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, ch * 0.55, cw, ch * 0.45);

    // Title
    ctx.font         = 'bold 48px Arial, sans-serif';
    ctx.fillStyle    = '#ffffff';
    ctx.textAlign    = 'center';
    ctx.textBaseline = 'middle';
    ctx.lineWidth    = 4;
    ctx.strokeStyle  = 'rgba(0,0,0,0.7)';
    ctx.strokeText('RACING', cw / 2, ch * 0.35);
    ctx.fillText('RACING', cw / 2, ch * 0.35);

    // Prompt — blinking
    var blink = Math.sin(R.state.time * 3) > 0;
    if (blink) {
      ctx.font         = '22px Arial, sans-serif';
      ctx.fillStyle    = '#ffcc00';
      ctx.textBaseline = 'middle';
      ctx.lineWidth    = 2;
      ctx.strokeStyle  = 'rgba(0,0,0,0.6)';
      ctx.strokeText('Press ENTER or tap to start', cw / 2, ch * 0.65);
      ctx.fillText('Press ENTER or tap to start', cw / 2, ch * 0.65);
    }

    ctx.restore();
  };

  // ── Race Results ────────────────────────────────────────────────────

  /**
   * R.renderRaceResults()
   * Semi-transparent dark overlay showing final race standings.
   */
  R.renderRaceResults = function () {
    var ctx = R.ctx;
    var cw  = R.canvas ? R.canvas.width  : 1280;
    var ch  = R.canvas ? R.canvas.height : 720;

    // Cache results on first render
    if (!_finalResults) {
      _finalResults = _buildResultsTable();
    }

    ctx.save();

    // Full-screen dark overlay
    ctx.fillStyle = 'rgba(0,0,0,0.75)';
    ctx.fillRect(0, 0, cw, ch);

    // Panel centered
    var panelW = 520;
    var panelH = 380;
    var panelX = (cw - panelW) / 2;
    var panelY = (ch - panelH) / 2;

    ctx.fillStyle = 'rgba(20,20,20,0.9)';
    ctx.strokeStyle = 'rgba(255,255,255,0.25)';
    ctx.lineWidth = 2;
    R._roundRect(ctx, panelX, panelY, panelW, panelH, 12);

    // Title
    ctx.font         = 'bold 32px Arial, sans-serif';
    ctx.fillStyle    = '#ffd700';
    ctx.textAlign    = 'center';
    ctx.textBaseline = 'top';
    ctx.lineWidth    = 3;
    ctx.strokeStyle  = 'rgba(0,0,0,0.7)';
    ctx.strokeText('RACE COMPLETE', cw / 2, panelY + 18);
    ctx.fillText('RACE COMPLETE', cw / 2, panelY + 18);

    // Divider
    ctx.strokeStyle = 'rgba(255,255,255,0.3)';
    ctx.lineWidth   = 1;
    ctx.beginPath();
    ctx.moveTo(panelX + 30, panelY + 62);
    ctx.lineTo(panelX + panelW - 30, panelY + 62);
    ctx.stroke();

    // Column headers
    var colPosX   = panelX + 50;
    var colNameX  = panelX + 120;
    var colTimeX  = panelX + panelW - 80;
    var headerY   = panelY + 72;

    ctx.font         = 'bold 11px Arial, sans-serif';
    ctx.fillStyle    = '#888888';
    ctx.textAlign    = 'center';
    ctx.textBaseline = 'top';
    ctx.fillText('POS', colPosX, headerY);
    ctx.fillText('DRIVER', colNameX, headerY);
    ctx.textAlign    = 'right';
    ctx.fillText('TIME', colTimeX, headerY);

    // Results rows
    var results = _finalResults || [];
    var rowH    = 32;
    var startY  = headerY + 22;

    for (var i = 0; i < results.length; i++) {
      var entry  = results[i];
      var rowY   = startY + i * rowH;
      var isPlayer = entry._isPlayer;

      // Row highlight
      if (isPlayer) {
        ctx.fillStyle = 'rgba(255,215,0,0.12)';
        ctx.fillRect(panelX + 20, rowY - 2, panelW - 40, rowH);
        ctx.strokeStyle = 'rgba(255,215,0,0.4)';
        ctx.lineWidth = 1;
        ctx.strokeRect(panelX + 20, rowY - 2, panelW - 40, rowH);
      }

      // Position
      var posColor = '#ffffff';
      if (i === 0) posColor = '#ffd700';
      else if (i === 1) posColor = '#c0c0c0';
      else if (i === 2) posColor = '#cd7f32';

      var suffix = 'th';
      if (i === 0) suffix = 'st';
      else if (i === 1) suffix = 'nd';
      else if (i === 2) suffix = 'rd';

      ctx.font         = 'bold 14px Arial, sans-serif';
      ctx.fillStyle    = posColor;
      ctx.textAlign    = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText((i + 1) + suffix, colPosX, rowY + rowH / 2);

      // Driver name / car color indicator
      ctx.fillStyle = entry._color || '#aaaaaa';
      ctx.beginPath();
      ctx.arc(colNameX - 10, rowY + rowH / 2, 5, 0, Math.PI * 2);
      ctx.fill();

      ctx.font         = isPlayer ? 'bold 15px Arial, sans-serif' : '14px Arial, sans-serif';
      ctx.fillStyle    = isPlayer ? '#ffff44' : '#dddddd';
      ctx.textAlign    = 'left';
      ctx.textBaseline = 'middle';
      ctx.fillText(entry._name || ('Car ' + (i + 1)), colNameX, rowY + rowH / 2);

      // Time
      ctx.font         = '14px "Courier New", monospace';
      ctx.fillStyle    = '#cccccc';
      ctx.textAlign    = 'right';
      ctx.textBaseline = 'middle';
      ctx.fillText(entry._timeStr || '--', colTimeX, rowY + rowH / 2);
    }

    // Restart prompt
    var promptY = panelY + panelH - 38;
    var blink = Math.sin(R.state.time * 3) > 0;
    if (blink) {
      ctx.font         = 'bold 16px Arial, sans-serif';
      ctx.fillStyle    = '#ffcc00';
      ctx.textAlign    = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('Press ENTER to restart', cw / 2, promptY);
    }

    ctx.restore();
  };

  /**
   * _buildResultsTable()
   * Internal: build the sorted results snapshot for the race-results overlay.
   * @returns {Array<Object>} sorted list of result entries
   */
  function _buildResultsTable() {
    var cars  = R.cars || [];
    var track = R.track;
    var totalLaps = (track && track.totalLaps) || 3;
    var entries = [];

    for (var i = 0; i < cars.length; i++) {
      var car = cars[i];
      var finished = car.finished || false;
      var lap      = car.lap || 0;
      var timeStr  = 'DNF';

      if (finished) {
        timeStr = _formatTime(car.finishTime || 0);
      } else if (lap >= totalLaps) {
        timeStr = 'DONE';
      }

      entries.push({
        _carIndex:  i,
        _isPlayer:  car === R.player,
        _color:     car.color || '#aaaaaa',
        _name:      car === R.player ? 'YOU' : (car.driverName || ('Car ' + (i + 1))),
        _lap:       lap,
        _finished:  finished,
        _finishTime: car.finishTime || 0,
        _timeStr:   timeStr
      });
    }

    // Sort: finished cars first (by finishTime asc), then by lap desc, then by checkpoint/x
    entries.sort(function (a, b) {
      if (a._finished && b._finished) {
        return a._finishTime - b._finishTime;
      }
      if (a._finished) return -1;
      if (b._finished) return 1;
      if (a._lap !== b._lap) return b._lap - a._lap;

      var carA = R.cars[a._carIndex];
      var carB = R.cars[b._carIndex];
      var lapA = carA ? (carA.checkpointIdx || 0) : 0;
      var lapB = carB ? (carB.checkpointIdx || 0) : 0;
      if (lapA !== lapB) return lapB - lapA;

      var xA = carA ? (carA.x || 0) : 0;
      var xB = carB ? (carB.x || 0) : 0;
      return xB - xA;
    });

    return entries;
  }

  /**
   * R.sortCarsByPosition()
   * Sort cars by race position: finished first, then by lap/checkpoint.
   * Used by both HUD and potentially other systems.
   * Each entry gets a _carIndex property so HUD can map back to R.cars.
   * @returns {Array<Object>} sorted list
   */
  R.sortCarsByPosition = function () {
    var cars  = R.cars || [];
    var track = R.track;
    var totalLaps = (track && track.totalLaps) || 3;
    var entries = [];

    for (var i = 0; i < cars.length; i++) {
      var car = cars[i];
      entries.push({
        _carIndex:  i,
        _isPlayer:  car === R.player,
        _lap:       car.lap || 0,
        _finished:  car.finished || false,
        _finishTime: car.finishTime || 0,
        _checkpointIdx: car.checkpointIdx || 0,
        _x:         car.x || 0,
        _y:         car.y || 0
      });
    }

    entries.sort(function (a, b) {
      if (a._finished && b._finished) {
        return a._finishTime - b._finishTime;
      }
      if (a._finished) return -1;
      if (b._finished) return 1;
      if (a._lap !== b._lap) return b._lap - a._lap;
      if (a._checkpointIdx !== b._checkpointIdx) {
        return b._checkpointIdx - a._checkpointIdx;
      }
      return b._x - a._x;
    });

    return entries;
  };

  // ── Utility helpers ─────────────────────────────────────────────────

  /**
   * _formatTime(seconds)
   * Format a time value in seconds as M:SS.mmm.
   * @param {number} sec
   * @returns {string}
   */
  function _formatTime(sec) {
    if (sec == null || isNaN(sec)) return '--';
    var m = Math.floor(sec / 60);
    var s = Math.floor(sec % 60);
    var ms = Math.floor((sec % 1) * 1000);
    return m + ':' +
      (s < 10 ? '0' : '') + s + '.' +
      (ms < 100 ? (ms < 10 ? '00' : '0') : '') + ms;
  }

  /**
   * R._roundRect(ctx, x, y, w, h, r)
   * Draw a filled rounded rectangle.
   */
  R._roundRect = function (ctx, x, y, w, h, r) {
    ctx.beginPath();
    R._roundRectPath(ctx, x, y, w, h, r);
    ctx.fill();
    ctx.stroke();
  };

  /**
   * R._roundRectPath(ctx, x, y, w, h, r)
   * Add a rounded rectangle path to the current context.
   */
  R._roundRectPath = function (ctx, x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.arcTo(x + w, y, x + w, y + r, r);
    ctx.lineTo(x + w, y + h - r);
    ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
    ctx.lineTo(x + r, y + h);
    ctx.arcTo(x, y + h, x, y + h - r, r);
    ctx.lineTo(x, y + r);
    ctx.arcTo(x, y, x + r, y, r);
    ctx.closePath();
  };

  /**
   * R._roundRectStroke(ctx, x, y, w, h, r)
   * Stroke-only rounded rectangle.
   */
  R._roundRectStroke = function (ctx, x, y, w, h, r) {

<script>
// === effects.js — Racing Game ===
// Visual effects system: particles, sparks, smoke, dust, screen effects.
// All functions attach to window.R.
// Expects: R.CONFIG, R.canvas, R.ctx, R.input, R.camera, R.state already exist.

(function() {
  'use strict';

  var R = window.R;

  // ──────────────────────────────────────────────
  // Constants (extend R.CONFIG if not already set)
  // ──────────────────────────────────────────────

  R.CONFIG = R.CONFIG || {};

  /** Max number of particles in the pool. */
  R.CONFIG.MAX_PARTICLES = R.CONFIG.MAX_PARTICLES || 3072;

  /** Default gravity applied to smoke-type particles per frame-equivalent tick. */
  R.CONFIG.PARTICLE_GRAVITY = R.CONFIG.PARTICLE_GRAVITY || 0.05;

  /** Speed-line activation threshold: fraction of maxSpeed. */
  R.CONFIG.SPEED_LINES_THRESHOLD = R.CONFIG.SPEED_LINES_THRESHOLD || 0.80;

  /** Max screen-shake pixel offset. */
  R.CONFIG.SHAKE_MAX_OFFSET = R.CONFIG.SHAKE_MAX_OFFSET || 8;

  // ──────────────────────────────────────────────
  // Color palettes (pre-built arrays, no allocation in hot path)
  // ──────────────────────────────────────────────

  const SPARK_COLORS = [
    '#FFFDE0', '#FFF9C4', '#FFF176', '#FFEE58',   // bright yellow
    '#FFE082', '#FFD54F', '#FFCA28',              // yellow-amber
    '#FFB300', '#FFA000', '#FF8F00',              // amber
    '#FF6D00', '#FF5722', '#E64A19',              // orange-deep orange
    '#BF360C', '#870000'                           // dark red / dark
  ];

  const SMOKE_COLORS = [
    '#E0E0E0', '#D6D6D6', '#CCCCCC', '#C0C0C0',
    '#B0B0B0', '#A0A0A0', '#909090', '#808080',
    '#707070', '#606060', '#505050'
  ];

  const DUST_COLORS = [
    '#D2B48C', '#C4A882', '#B89A6A', '#AA8C56',
    '#9B7E4A', '#8B7355', '#7D6B4E', '#6B5B3E',
    '#A0522D', '#CD853F', '#DEB887', '#F5DEB3'
  ];

  const DRIFT_SMOKE_COLORS = [
    '#F5F5F5', '#EEEEEE', '#E0E0E0', '#D0D0D0',
    '#BDBDBD', '#AAAAAA', '#969696', '#848484'
  ];

  // ──────────────────────────────────────────────
  // Helper utilities (pure functions, no allocations)
  // ──────────────────────────────────────────────

  /**
   * Return a random float in [min, max).
   * @param {number} min
   * @param {number} max
   * @returns {number}
   */
  function randRange(min, max) {
    return min + Math.random() * (max - min);
  }

  /**
   * Return a random integer in [min, max] inclusive.
   * @param {number} min
   * @param {number} max
   * @returns {number}
   */
  function randInt(min, max) {
    return Math.floor(randRange(min, max + 1));
  }

  /**
   * Pick a random element from an array (used only at spawn time, not in hot render path).
   * @param {Array} arr
   * @returns {*}
   */
  function randPick(arr) {
    return arr[randInt(0, arr.length - 1)];
  }

  /**
   * Clamp a value between min and max.
   * @param {number} val
   * @param {number} min
   * @param {number} max
   * @returns {number}
   */
  function clamp(val, min, max) {
    return val < min ? min : (val > max ? max : val);
  }

  /**
   * Linear interpolation between two hex-like colors by decomposing RGB channels.
   * Returns a CSS rgb() string for simplicity.
   * @param {string} c1 - hex color like '#FF8800'
   * @param {string} c2 - hex color like '#FF0000'
   * @param {number} t - blend factor 0..1
   * @returns {string} rgb() string
   */
  function lerpColor(c1, c2, t) {
    const r1 = parseInt(c1.slice(1, 3), 16);
    const g1 = parseInt(c1.slice(3, 5), 16);
    const b1 = parseInt(c1.slice(5, 7), 16);
    const r2 = parseInt(c2.slice(1, 3), 16);
    const g2 = parseInt(c2.slice(3, 5), 16);
    const b2 = parseInt(c2.slice(5, 7), 16);
    const r = Math.round(r1 + (r2 - r1) * t);
    const g = Math.round(g1 + (g2 - g1) * t);
    const b = Math.round(b1 + (b2 - b1) * t);
    return 'rgb(' + r + ',' + g + ',' + b + ')';

  /**
   * Return a spark color based on life ratio (1.0 = newborn → 0.0 = dying).
   * Early life: bright yellow-white; mid: orange; late: red; end: dark red.
   * @param {number} t - life ratio 0..1
   * @returns {string} hex color
   */
  function sparkColorByLife(t) {
    const idx = Math.floor((1 - t) * (SPARK_COLORS.length - 1));
    return SPARK_COLORS[clamp(idx, 0, SPARK_COLORS.length - 1)];
  }

  /**
   * Return a smoke color based on life ratio (newborn light gray → dying darker).
   * @param {number} t - life ratio 0..1
   * @returns {string} hex color
   */
  function smokeColorByLife(t) {
    const idx = Math.floor(t * (SMOKE_COLORS.length - 1));
    return SMOKE_COLORS[clamp(idx, 0, SMOKE_COLORS.length - 1)];
  }

  // ──────────────────────────────────────────────
  // Particle pool
  // ──────────────────────────────────────────────

  /** @type {number} Next spawn slot in the pool (cyclic). */
  let _nextSpawnIndex = 0;

  /**
   * Create a dead particle template.
   * @returns {Object}
   */
  function createDeadParticle() {
    return {
      x: 0,
      y: 0,
      vx: 0,
      vy: 0,
      life: 0,
      maxLife: 0,
      size: 0,
      color: '#000',
      alpha: 0,
      type: 'spark'   // 'spark' | 'smoke' | 'dust' | 'debris'
    };
  }

  /**
   * Initialize the particle pool.
   * Pre-allocate R.particles with MAX_PARTICLES dead particles.
   * Safe to call multiple times — clears and rebuilds the pool.
   */
  R.initEffects = function() {
    const max = R.CONFIG.MAX_PARTICLES;
    R.particles = new Array(max);
    for (let i = 0; i < max; i++) {
      R.particles[i] = createDeadParticle();
    }
    _nextSpawnIndex = 0;
    R._shakeIntensity = 0;
    R._shakeDuration = 0;
    R._shakeTimer = 0;
  };

  /**
   * Activate a dead particle from the pool and configure it.
   * If no dead particle is available, recycle the oldest one (cyclic overwrite).
   *
   * @param {number} x - world/screen X position
   * @param {number} y - world/screen Y position
   * @param {Object} config
   * @param {number} [config.vx] - horizontal velocity; random if omitted
   * @param {number} [config.vy] - vertical velocity; random if omitted
   * @param {number} [config.vxRange] - if vx omitted, random range [-vxRange, vxRange]
   * @param {number} [config.vyRange] - if vy omitted, random range [-vyRange, vyRange]
   * @param {number} config.life - particle lifetime in frames
   * @param {number} config.size - particle size in px
   * @param {string} config.color - fill color (hex or rgb)
   * @param {string} [config.type='spark'] - particle type
   * @param {number} [config.alpha=1] - starting alpha
   * @returns {Object|null} the activated particle, or null if pool is empty (should not happen)
   */
  R.spawnParticle = function(x, y, config) {
    if (!R.particles || R.particles.length === 0) return null;

    const max = R.particles.length;
    let p = null;

    // Strategy 1: find the first dead particle starting from the current
    // write-pointer position (avoids always scanning from index 0).
    for (let attempt = 0; attempt < max; attempt++) {
      const idx = (_nextSpawnIndex + attempt) % max;
      if (R.particles[idx].life <= 0) {
        p = R.particles[idx];
        _nextSpawnIndex = (idx + 1) % max;
        break;
      }
    }

    // Strategy 2: all particles are alive — recycle the oldest (cyclic write pointer).
    if (!p) {
      p = R.particles[_nextSpawnIndex];
      _nextSpawnIndex = (_nextSpawnIndex + 1) % max;
    }

    // Configure particle
    p.x = x;
    p.y = y;
    p.vx = config.vx !== undefined ? config.vx : randRange(-(config.vxRange || 3), config.vxRange || 3);
    p.vy = config.vy !== undefined ? config.vy : randRange(-(config.vyRange || 3), config.vyRange || 3);
    p.life = config.life || 30;
    p.maxLife = config.life || 30;
    p.size = config.size || 3;
    p.color = config.color || '#FFFFFF';
    p.alpha = config.alpha !== undefined ? config.alpha : 1.0;
    p.type = config.type || 'spark';

    return p;
  };

  /**
   * Spawn a burst of spark particles.
   * Each spark: small (2-4px), bright yellow/orange, high velocity in a random direction,
   * short life (20-40 frames), colors cycle from yellow → orange → red → dark.
   *
   * @param {number} x - origin X
   * @param {number} y - origin Y
   * @param {number} count - number of spark particles to spawn
   */
  R.spawnSparks = function(x, y, count) {
    for (let i = 0; i < count; i++) {
      const angle = randRange(0, Math.PI * 2);
      const speed = randRange(2, 8);
      const life = randInt(20, 40);
      const size = randRange(2, 4);

      R.spawnParticle(x, y, {
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        life: life,
        size: size,
        color: SPARK_COLORS[0],   // initial color — cycling handled per-type in render
        type: 'spark',
        alpha: 1.0
      });
    }
  };

  /**
   * Spawn smoke particles (for exhaust plumes, tire smoke).
   * Each: larger (6-12px), gray, slow upward drift, medium life (40-80 frames),
   * alpha fades from 0.6 → 0.
   *
   * @param {number} x - origin X
   * @param {number} y - origin Y
   * @param {number} count - number of smoke particles to spawn
   */
  R.spawnSmoke = function(x, y, count) {
    for (let i = 0; i < count; i++) {
      const life = randInt(40, 80);
      const size = randRange(6, 12);

      R.spawnParticle(x, y, {
        vx: randRange(-0.8, 0.8),
        vy: randRange(-1.5, -0.3),   // upward drift
        life: life,
        size: size,
        color: randPick(SMOKE_COLORS.slice(0, 4)),   // lighter grays initially
        type: 'smoke',
        alpha: randRange(0.35, 0.6)
      });
    }
  };

  /**
   * Spawn dust particles (off-road / grass kick-up).
   * Each: brown/tan, medium size (3-6px), low velocity, medium-short life (20-50 frames).
   *
   * @param {number} x - origin X
   * @param {number} y - origin Y
   * @param {number} count - number of dust particles to spawn
   */
  R.spawnDust = function(x, y, count) {
    for (let i = 0; i < count; i++) {
      const life = randInt(20, 50);
      const size = randRange(3, 6);

      R.spawnParticle(x, y, {
        vx: randRange(-1.5, 1.5),
        vy: randRange(-2.0, 0.2),    // slight upward bias
        life: life,
        size: size,
        color: randPick(DUST_COLORS),
        type: 'dust',
        alpha: randRange(0.4, 0.75)
      });
    }
  };

  /**
   * Spawn tire smoke during drifting from both rear wheel positions.
   * Two plumes from rear wheel positions offset from car center.
   * intensity affects spawn rate and particle count (~1-6 particles per plume per call).
   *
   * @param {number} carX - car center X (world)
   * @param {number} carY - car center Y (world)
   * @param {number} carAngle - car heading angle in radians
   * @param {number} intensity - 0..1 drift intensity (0 = no drift, 1 = full lock)
   */
  R.spawnDriftSmoke = function(carX, carY, carAngle, intensity) {
    if (intensity <= 0.02) return;   // negligible — skip

    // Rear wheel positions relative to car center
    const rearOffset = 35;   // px behind center
    const wheelSpan = 22;    // px left/right of center

    const cosA = Math.cos(carAngle);
    const sinA = Math.sin(carAngle);

    // Rear-left wheel world position
    const rlX = carX - rearOffset * cosA - wheelSpan * sinA;
    const rlY = carY - rearOffset * sinA + wheelSpan * cosA;

    // Rear-right wheel world position
    const rrX = carX - rearOffset * cosA + wheelSpan * sinA;
    const rrY = carY - rearOffset * sinA - wheelSpan * cosA;

    // Particle count per plume scales with intensity
    const baseCount = Math.floor(intensity * 6) + 1;

    for (let plume = 0; plume < 2; plume++) {
      const px = plume === 0 ? rlX : rrX;
      const py = plume === 0 ? rlY : rrY;
      const count = baseCount + randInt(0, 2);

      for (let i = 0; i < count; i++) {
        const life = randInt(30, 60);
        const size = randRange(4, 10);

        // Drift smoke billows outward from the drift direction
        const spreadAngle = carAngle + Math.PI / 2 + randRange(-0.6, 0.6);
        const spreadSpeed = randRange(0.5, 2.0) * intensity;

        R.spawnParticle(px + randRange(-4, 4), py + randRange(-4, 4), {
          vx: Math.cos(spreadAngle) * spreadSpeed,
          vy: Math.sin(spreadAngle) * spreadSpeed - randRange(0.3, 1.0),   // slight upward
          life: life,
          size: size,
          color: randPick(DRIFT_SMOKE_COLORS),
          type: 'smoke',
          alpha: randRange(0.3, 0.55) * intensity

  /**
   * Spawn a burst of debris particles (for collisions, crashes).
   * Debris: varied sizes, darker colors, affected by gravity, medium-long life.
   *
   * @param {number} x - origin X
   * @param {number} y - origin Y
   * @param {number} count - number of debris particles
   */
  R.spawnDebris = function(x, y, count) {
    const debrisColors = ['#555555', '#444444', '#666666', '#333333', '#777777',
                          '#884444', '#885522', '#556633'];
    for (let i = 0; i < count; i++) {
      const angle = randRange(0, Math.PI * 2);
      const speed = randRange(1, 5);
      const life = randInt(30, 70);
      const size = randRange(1.5, 5);

      R.spawnParticle(x, y, {
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed - randRange(1, 3),   // slight upward toss
        life: life,
        size: size,
        color: randPick(debrisColors),
        type: 'debris',
        alpha: 0.9
      });
    }
  };

  // ──────────────────────────────────────────────
  // Particle update
  // ──────────────────────────────────────────────

  /**
   * Update all alive particles.
   * Called each frame from the game loop.
   *
   * Steps:
   *  1. Decrement life by dt * 60 (normalize to ~60fps frame ticks)
   *  2. Update position: x += vx * dt * 60, y += vy * dt * 60
   *  3. Apply gravity to smoke / debris types: vy -= gravity
   *  4. Fade alpha based on life/maxLife ratio
   *  5. Mark dead if life <= 0
   *
   * @param {number} dt - delta time in seconds
   */
  R.updateEffects = function(dt) {
    if (!R.particles || R.particles.length === 0) return;

    const frameScale = dt * 60;   // normalize to 60fps equivalent
    const gravity = R.CONFIG.PARTICLE_GRAVITY;
    const particles = R.particles;
    const len = particles.length;

    for (let i = 0; i < len; i++) {
      const p = particles[i];
      if (p.life <= 0) continue;   // dead particle, skip

      // 1. Decrement life
      p.life -= frameScale * 1;    // life measured in frame-ticks

      // 2. Update position
      p.x += p.vx * frameScale;
      p.y += p.vy * frameScale;

      // 3. Apply gravity for affected types
      if (p.type === 'smoke' || p.type === 'debris') {
        p.vy += gravity * frameScale;
      }

      // 4. Fade alpha
      const lifeRatio = p.life / p.maxLife;
      if (p.type === 'smoke') {
        // Smoke fades out in the last 40% of its life
        p.alpha = lifeRatio > 0.4 ? p.alpha : (p.alpha * (lifeRatio / 0.4));
      } else if (p.type === 'dust') {
        // Dust fades smoothly
        p.alpha = lifeRatio * 0.7;
      } else {
        // Sparks / debris: hold alpha then fade sharply at end
        p.alpha = lifeRatio > 0.3 ? 1.0 : lifeRatio / 0.3;
      }

      // 5. Mark dead
      if (p.life <= 0) {
        p.life = 0;
        p.alpha = 0;
      }
    }

    // Update screen shake
    R.updateScreenShake(dt);
  };

  // ──────────────────────────────────────────────
  // Particle rendering
  // ──────────────────────────────────────────────

  /**
   * Render all alive particles.
   * Called each frame from the game loop.
   * For each alive particle:
   *   - Set ctx.globalAlpha = particle.alpha
   *   - Set ctx.fillStyle based on particle type and life ratio
   *   - Draw as small circle (spark, smoke, dust) or square (debris)
   *   - Reset globalAlpha to 1.0
   */
  R.renderEffects = function() {
    if (!R.particles || R.particles.length === 0) return;

    const ctx = R.ctx;
    const particles = R.particles;
    const len = particles.length;
    let aliveCount = 0;

    ctx.save();

    for (let i = 0; i < len; i++) {
      const p = particles[i];
      if (p.life <= 0 || p.alpha <= 0.005) continue;   // skip dead or invisible

      aliveCount++;

      const lifeRatio = clamp(p.life / p.maxLife, 0, 1);

      // Determine color based on particle type
      let color;
      switch (p.type) {
        case 'spark':
          color = sparkColorByLife(lifeRatio);
          break;
        case 'smoke':
          color = smokeColorByLife(lifeRatio);
          break;
        case 'dust':
          color = p.color;    // dust uses its assigned color, just fades alpha
          break;
        case 'debris':
          color = p.color;
          break;
        default:
          color = p.color;
      }

      ctx.globalAlpha = clamp(p.alpha, 0, 1);
      ctx.fillStyle = color;

      const halfSize = p.size / 2;

      switch (p.type) {
        case 'spark':
          // Small bright circle, sometimes with a glow
          ctx.beginPath();
          ctx.arc(p.x, p.y, halfSize, 0, Math.PI * 2);
          ctx.fill();
          // Tiny glow for bright sparks
          if (lifeRatio > 0.5 && p.size >= 3) {
            ctx.globalAlpha = clamp(p.alpha * 0.35, 0, 1);
            ctx.beginPath();
            ctx.arc(p.x, p.y, halfSize * 2, 0, Math.PI * 2);
            ctx.fill();
          }
          break;

        case 'smoke':
          // Soft round puff
          ctx.beginPath();
          ctx.arc(p.x, p.y, halfSize, 0, Math.PI * 2);
          ctx.fill();
          break;

        case 'dust':
          // Small irregular — use a filled circle, optionally a little scatter
          ctx.beginPath();
          ctx.arc(p.x, p.y, halfSize, 0, Math.PI * 2);
          ctx.fill();
          break;

        case 'debris':
          // Small square / rectangle oriented randomly
          ctx.fillRect(p.x - halfSize, p.y - halfSize * 0.6, p.size, p.size * 0.6);
          break;

        default:
          ctx.beginPath();
          ctx.arc(p.x, p.y, halfSize, 0, Math.PI * 2);
          ctx.fill();
      }
    }

    ctx.restore();
    // Always reset globalAlpha
    ctx.globalAlpha = 1.0;

    return aliveCount;
  };

  // ──────────────────────────────────────────────
  // Screen shake
  // ──────────────────────────────────────────────

  /**
   * Trigger a screen shake effect.
   *
   * @param {number} intensity - max pixel offset (e.g. 4 = up to 4px shake)
   * @param {number} [duration=15] - shake duration in frames (~0.25s at 60fps)
   */
  R.triggerScreenShake = function(intensity, duration) {
    if (!intensity || intensity <= 0) return;

    const dur = duration || 15;

    // If already shaking with higher intensity, don't downgrade
    if (R._shakeTimer > 0 && R._shakeIntensity > intensity) {
      // Keep the existing stronger shake
      return;
    }

    R._shakeIntensity = clamp(intensity, 0, R.CONFIG.SHAKE_MAX_OFFSET);
    R._shakeDuration = dur;
    R._shakeTimer = dur;
  };

  /**
   * Update screen shake state — decay intensity over time.
   * Called automatically from R.updateEffects().
   *
   * @param {number} dt - delta time in seconds
   */
  R.updateScreenShake = function(dt) {
    if (!R._shakeTimer || R._shakeTimer <= 0) {
      R._shakeIntensity = 0;
      R._shakeOffsetX = 0;
      R._shakeOffsetY = 0;
      return;
    }

    const frameScale = dt * 60;
    R._shakeTimer -= frameScale;

    if (R._shakeTimer <= 0) {
      R._shakeIntensity = 0;
      R._shakeOffsetX = 0;
      R._shakeOffsetY = 0;
      R._shakeTimer = 0;
      return;
    }

    // Decay factor: intensity ramps down linearly
    const decay = R._shakeTimer / R._shakeDuration;
    const currentIntensity = R._shakeIntensity * decay;

    // Random offset within current intensity range; changes each frame for jitter
    R._shakeOffsetX = randRange(-currentIntensity, currentIntensity);
    R._shakeOffsetY = randRange(-currentIntensity, currentIntensity);
  };

  /**
   * Apply screen shake offset to the canvas transform.
   * Call this in the render pipeline before drawing world objects,
   * or apply the offset manually to R.camera.
   *
   * Returns the current shake offsets { x, y } so the caller can apply them.
   *
   * @returns {{x: number, y: number}}
   */
  R.getScreenShakeOffset = function() {
    return {
      x: R._shakeOffsetX || 0,
      y: R._shakeOffsetY || 0
    };
  };

  /**
   * Legacy / compatibility wrapper: directly applies shake via ctx.translate.
   * Use getScreenShakeOffset + manual application in the render pipeline
   * for more control. This is a convenience method.
   */
  R.renderScreenShake = function() {
    if (!R._shakeTimer || R._shakeTimer <= 0) return;

    const offset = R.getScreenShakeOffset();
    if (offset.x !== 0 || offset.y !== 0) {
      R.ctx.translate(offset.x, offset.y);
    }
  };

  // ──────────────────────────────────────────────
  // Speed lines
  // ──────────────────────────────────────────────

  /**
   * Render speed lines at screen edges when the player is at high speed.
   * Lines streak backward to create a speed-sensation effect.
   *
   * Requires: R.playerCar (the player's car object with .speed and .maxSpeed).
   * Safe to call even if playerCar is not ready — returns silently.
   */
  R.renderSpeedLines = function() {
    const car = R.playerCar;
    if (!car || !car.maxSpeed) return;

    const speedRatio = car.speed / car.maxSpeed;
    if (speedRatio < R.CONFIG.SPEED_LINES_THRESHOLD) return;

    const ctx = R.ctx;
    const w = R.canvas.width;
    const h = R.canvas.height;

    // Intensity 0..1 based on speed above threshold
    const intensity = (speedRatio - R.CONFIG.SPEED_LINES_THRESHOLD) /
                      (1.0 - R.CONFIG.SPEED_LINES_THRESHOLD);

    const lineCount = Math.floor(intensity * 18) + 4;
    const maxLength = intensity * 120 + 30;
    const minLength = maxLength * 0.3;

    ctx.save();

    // Lines run horizontally, concentrated near top and bottom edges
    for (let i = 0; i < lineCount; i++) {
      const topEdge = Math.random() < 0.5;
      const y = topEdge
        ? randRange(0, h * 0.08)                          // near top
        : randRange(h * 0.92, h);                          // near bottom

      const length = randRange(minLength, maxLength);
      const xStart = randRange(0, w);
      const xEnd = xStart - length;                        // streak left (backward)

      const alpha = randRange(0.08, 0.22) * intensity;
      const lineWidth = randRange(1, 2.5);

      ctx.globalAlpha = alpha;
      ctx.strokeStyle = '#FFFFFF';
      ctx.lineWidth = lineWidth;
      ctx.lineCap = 'round';

      ctx.beginPath();
      ctx.moveTo(xStart, y);
      ctx.lineTo(xEnd, y);
      ctx.stroke();

      // Occasionally add a slightly wider, more transparent glow line
      if (Math.random() < 0.3) {
        ctx.globalAlpha = alpha * 0.4;
        ctx.lineWidth = lineWidth * 3;
        ctx.beginPath();
        ctx.moveTo(xStart, y);
        ctx.lineTo(xEnd, y);
        ctx.stroke();
      }
    }

    ctx.restore();
    ctx.globalAlpha = 1.0;
  };

  // ──────────────────────────────────────────────
  // Exhaust particles (engine running)
  // ──────────────────────────────────────────────

  /**
   * Spawn exhaust particles behind a car.
   * Called each frame for every active car during racing.
   *
   * @param {number} carX - car center X (world)
   * @param {number} carY - car center Y (world)
   * @param {number} carAngle - car heading angle in radians
   * @param {number} throttle - 0..1 throttle amount
   * @param {number} speed - current car speed (used to reduce exhaust at speed)
   * @param {number} maxSpeed - car's maximum speed
   */
  R.spawnExhaust = function(carX, carY, carAngle, throttle, speed, maxSpeed) {
    if (throttle <= 0.05) return;

    // Exhaust decreases at very high speeds (less visible)
    const speedRatio = maxSpeed > 0 ? speed / maxSpeed : 0;
    const exhaustFactor = throttle * (1 - speedRatio * 0.6);

    if (exhaustFactor < 0.1) return;

    // Exhaust comes from behind the car
    const rearOffset = 30;
    const exhaustX = carX - Math.cos(carAngle) * rearOffset;
    const exhaustY = carY - Math.sin(carAngle) * rearOffset;

    const count = Math.floor(exhaustFactor * 3) + 1;

    for (let i = 0; i < count; i++) {
      const life = randInt(25, 50);
      const size = randRange(3, 7);

      R.spawnParticle(exhaustX + randRange(-6, 6), exhaustY + randRange(-3, 3), {
        vx: -Math.cos(carAngle) * randRange(0.2, 0.8) + randRange(-0.2, 0.2),
        vy: -Math.sin(carAngle) * randRange(0.2, 0.8) - randRange(0.5, 1.2),
        life: life,
        size: size,
        color: randPick(SMOKE_COLORS.slice(3, 8)),   // mid-to-dark grays
        type: 'smoke',
        alpha: randRange(0.15, 0.35) * exhaustFactor
      });
    }
  };

  // ──────────────────────────────────────────────
  // Collision burst (called on car-to-car or car-to-wall impact)
  // ──────────────────────────────────────────────

  /**
   * Spawn a combined spark+debris burst at the impact point.
   * Also triggers screen shake proportional to impact force.
   *
   * @param {number} x - impact position X
   * @param {number} y - impact position Y
   * @param {number} force - 0..1 impact severity
   */
  R.spawnCollisionBurst = function(x, y, force) {
    const clampedForce = clamp(force, 0, 1);

    const sparkCount = Math.floor(clampedForce * 25) + 5;
    const debrisCount = Math.floor(clampedForce * 10) + 2;
    const shakeIntensity = clampedForce * 8;

    R.spawnSparks(x, y, sparkCount);
    R.spawnDebris(x, y, debrisCount);
    R.triggerScreenShake(shakeIntensity, Math.floor(clampedForce * 25) + 5);
  };

  // ──────────────────────────────────────────────
  // Off-road particle burst
  // ──────────────────────────────────────────────

  /**
   * Spawn dust particles when a car goes off the track surface.
   * Call rate-limited (e.g. every 2-3 frames) from the car update logic.
   *
   * @param {number} x - car position X
   * @param {number} y - car position Y
   * @param {number} speed - current car speed for intensity scaling
   * @param {number} maxSpeed - car max speed
   */
  R.spawnOffRoadDust = function(x, y, speed, maxSpeed) {
    const speedRatio = maxSpeed > 0 ? clamp(speed / maxSpeed, 0, 1) : 0;
    const count = Math.floor(speedRatio * 8) + 1;

    R.spawnDust(x, y, count);
  };

  // ──────────────────────────────────────────────
  // Diagnostics / pool stats (non-hot-path, for debug)
  // ──────────────────────────────────────────────

  /**
   * Return the count of alive particles currently in the pool.
   * Useful for debug overlays and performance monitoring.
   *
   * @returns {number}
   */
  R.getAliveParticleCount = function() {
    if (!R.particles) return 0;
    let count = 0;
    for (let i = 0; i < R.particles.length; i++) {
      if (R.particles[i].life > 0) count++;
    }
    return count;
  };

  /**
   * Return pool utilization as a fraction (0..1).
   * @returns {number}
   */
  R.getPoolUtilization = function() {
    if (!R.particles || R.particles.length === 0) return 0;
    return R.getAliveParticleCount() / R.particles.length;
  };

  /**
   * Kill all particles and reset screen shake.
   * Useful when resetting the race or returning to menu.
   */
  R.clearAllEffects = function() {
    if (R.particles) {
      for (let i = 0; i < R.particles.length; i++) {
        R.particles[i].life = 0;
        R.particles[i].alpha = 0;
      }
    }
    _nextSpawnIndex = 0;
    R._shakeTimer = 0;
    R._shakeIntensity = 0;
    R._shakeOffsetX = 0;
    R._shakeOffsetY = 0;
  };

})();

// ──────────────────────────────────────────────
// Exported functions/objects (all attached to window.R):
//
// R.CONFIG.MAX_PARTICLES              — max pool size (default 3072)
// R.CONFIG.PARTICLE_GRAVITY           — gravity for smoke/debris (default 0.05)
// R.CONFIG.SPEED_LINES_THRESHOLD      — speed ratio to trigger lines (default 0.80)
// R.CONFIG.SHAKE_MAX_OFFSET           — max screen shake px (default 8)
//
// R.particles                          — particle pool array
//
// R.initEffects()                      — pre-allocate particle pool
// R.spawnParticle(x, y, config)        — activate a single particle from pool
// R.spawnSparks(x, y, count)           — burst of spark particles
// R.spawnSmoke(x, y, count)            — burst of smoke particles
// R.spawnDust(x, y, count)             — burst of dust particles
// R.spawnDriftSmoke(cx, cy, ang, int)  — tire smoke from rear wheels
// R.spawnDebris(x, y, count)           — burst of debris particles
// R.spawnExhaust(cx, cy, ang, thr, sp, mx) — exhaust particles behind car
// R.spawnCollisionBurst(x, y, force)   — combined spark+debris+shake
// R.spawnOffRoadDust(x, y, speed, max) — dust when off-track
//
// R.updateEffects(dt)                  — update all alive particles + shake
// R.renderEffects()                    — render all alive particles
//
// R.triggerScreenShake(intensity, dur) — start screen shake
// R.updateScreenShake(dt)              — decay shake (auto-called by updateEffects)
// R.getScreenShakeOffset()             — { x, y } current shake offset
// R.renderScreenShake()                — apply shake via ctx.translate
// R.renderSpeedLines()                 — speed sensation lines at edges
//
// R.getAliveParticleCount()            — debug: count alive particles
// R.getPoolUtilization()               — debug: pool usage ratio
// R.clearAllEffects()                  — reset all particles and shake
// ──────────────────────────────────────────────

</script>
